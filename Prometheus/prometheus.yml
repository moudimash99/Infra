global:
  scrape_interval: 15s

scrape_configs:
  # === EC2 host metrics (node-exporter on port 9100) ===
  - job_name: 'ec2_node'
    static_configs:
      - targets: ['51.20.59.169:9100']

  # === EC2 container metrics (cAdvisor on port 8080) ===
  - job_name: 'ec2_cadvisor'
    static_configs:
      - targets: ['51.20.59.169:8080']
