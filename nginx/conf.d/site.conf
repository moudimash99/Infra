# HTTP virtual host (Cloudflare Tunnel will provide HTTPS at the edge)
server {
  listen 80;
  listen [::]:80;
  server_name machaka.net mohammad.machaka.net;

  # Proxy -> Next.js app in the 'web' container on proxy_net
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:3000;
  }
}
server {
  listen 80;
  listen [::]:80;
  server_name unmatched.machaka.net;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CHANGE THIS to your Unmatched container name + port
    proxy_pass http://unmatched:80;
  }
}
server {
  listen 80;
  listen [::]:80;
  server_name *.machaka.net;

  return 404;
}
