server {
  listen 80;
  listen [::]:80;
  server_name unmatchedtournament.machaka.net;

  # The tournament app moved into unmatched (2026-10-24); old links land on its tournaments page.
  return 301 https://unmatched.machaka.net/tournaments;
}
server {
  listen 80;
  listen [::]:80;
  server_name freemotion.machaka.net;

  # Free Motion dashboard: the freemotion container on proxy_net (plain Docker, not k3s).
  # Cloudflare Access in front of it; the app checks the Access login itself too.
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://freemotion:8790;
  }
}
server {
  listen 80;
  listen [::]:80;
  server_name *.machaka.net;

  # Every other name goes to the k3s cluster: Traefik routes it by its Ingress, or answers 404.
  # A new app in the cluster then only needs its Ingress and a DNS record in Cloudflare.
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://192.168.1.135:80;
  }
}