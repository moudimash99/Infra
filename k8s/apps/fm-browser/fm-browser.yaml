# Free Motion's browsers (2026-11-10): one pod per lane, Camoufox behind @playwright/mcp on :8931. The drivers run in
# fm-controller and reach their lane's browser at http://<pod>.fm-browser.apps.svc.cluster.local:8931/mcp.
# The working folder is /fm/fm-data, the controller's data path, mounted from the server by NFS: file names a driver
# gives (form inventories, screenshots) and files it uploads (CV, letter) mean the same file on both sides.
# Each pod keeps its browser profile (site sessions) on its node: /srv/apps/freemotion-browser/<pod>, which must exist
# owned by uid 1000 (sudo mkdir … && sudo chown -R 1000:1000 /srv/apps/freemotion-browser): one the kubelet makes is
# root's, and Camoufox then cannot start ("Failed to launch the browser process"). Done on the Acer for -0 and -1.
# Only the controller may connect (NetworkPolicy below). Same image as the controller (images/fm), role "browser".
# replicas: 2 since the cut-over (2026-11-11). The PC joins later as another node with its own StatefulSet (fm-browser-pc).
apiVersion: v1
kind: Service
metadata:
  name: fm-browser
  namespace: apps
spec:
  clusterIP: None   # one DNS name per pod
  selector: { app: fm-browser }
  ports:
    - { name: mcp, port: 8931, targetPort: mcp }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fm-browser-acer
  namespace: apps
  labels: { app: fm-browser }
  # Flux leaves this alone (Infra#7): a change restarts it, so it is applied by hand between rounds.
  annotations: { kustomize.toolkit.fluxcd.io/reconcile: disabled }
spec:
  serviceName: fm-browser
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: fm-browser, node: acer }
  template:
    metadata:
      labels: { app: fm-browser, node: acer }
    spec:
      nodeSelector: { kubernetes.io/hostname: acer-laptop }
      tolerations:
        - { key: dedicated, value: worker, effect: NoSchedule }
      # A full Acer stops a lane before Frigate or a site (k8s/cluster/priority.yaml): the job in hand is lost, never sent twice.
      priorityClassName: batch-high
      automountServiceAccountToken: false
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: browser
          image: docker.io/library/fm:2026-11-26a
          imagePullPolicy: Never
          # The image's "browser" role (images/fm/entrypoint.sh): Camoufox's config for this machine, then playwright-mcp
          # with --shared-browser-context, one browser per lane reused by every driver session (one per job). Before image
          # 2026-11-26a (the first build that carries that flag) these steps were spelled out here as a bash -c.
          args: ["browser"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: HOME, value: /tmp }
            - { name: FM_ALLOWED_HOSTS, value: "*" }   # who may connect is the NetworkPolicy's job
          securityContext: { allowPrivilegeEscalation: false, privileged: false }
          ports:
            - { name: mcp, containerPort: 8931 }
          readinessProbe:
            tcpSocket: { port: mcp }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /fm/fm-data }
            - { name: profile, mountPath: /profile, subPathExpr: $(POD_NAME) }
            - { name: shm, mountPath: /dev/shm }
          resources:
            # 2026-11-23: peaks over 3 days were 1,223 and 1,535 MiB (the second at its old 1536Mi limit), /dev/shm
            # included. Booked a little higher (the Acer is booked full, see k8s/cluster/priority.yaml) and given room
            # so a browser is not killed by its own limit in the middle of a form.
            requests: { cpu: 300m, memory: 1152Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          nfs: { server: 192.168.1.116, path: /srv/apps/freemotion/fm-data }
        - name: profile
          hostPath: { path: /srv/apps/freemotion-browser, type: Directory }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fm-browser
  namespace: apps
spec:
  podSelector:
    matchLabels: { app: fm-browser }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: fm-controller }
      ports:
        - { port: 8931 }
