# bg-taste-match: board game YouTube reviewers matched to a BGG profile (repo moudimash99/bg-taste-match). No web page:
# scheduled stages on the Acer, sharing one working folder (code + SQLite + captions + speaker data) and the audio.
#   fetch  every 2 hours audio downloads (yt-dlp, 30 s apart); a YouTube block ends the pass (see deploy/run_fetch.sh)
#   gpu    every hour    Whisper captions/transcripts, then speaker separation (GTX 1050 through the nvidia runtime)
#   llm    every hour at night  first rating pass and BGG matching, the Gemini website through Free Motion's fm-webllm
#                        (one pace and cap for every Gemini call on the account); quiet while fm-webllm doesn't answer
#   shell  always        an idle pod with the same mounts, for the stages run by hand (voice ID, matching, scoring)
# The stage scripts run from the code folder (deploy/run_*.sh), so a change needs push_code.sh, not a new image.
# Each stage skips finished work and concurrencyPolicy: Forbid keeps one run of each at a time. SQLite is shared by
# processes on one host, as on the PC. Image built by deploy/build.sh in the repo and imported by hand (no registry).
# Code goes to /srv/apps/bg-taste-match with deploy/push_code.sh; never copy bgtaste.db over the live one.
# Secret (not in this repo): kubectl -n apps create secret generic bg-taste-match --from-literal=HF_TOKEN=...
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bg-taste-match-fetch
  namespace: apps
  labels: { app: bg-taste-match }
spec:
  schedule: "5 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app: bg-taste-match, stage: fetch }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-low
          containers:
            - name: fetch
              image: docker.io/library/bg-taste-match:2026-11-10a
              imagePullPolicy: Never
              command: ["sh", "/work/deploy/run_fetch.sh"]
              env:
                # Rahdo and Dice Tower last (2026-11-22): the two biggest download into whatever room the others
                # leave; get_audio.py stops at 150 GB free on the Acer's system disk.
                - name: CHANNELS
                  value: "hc oscs bgco gbg tbm bgb dtg bower ttgg mvm tantrum amass 3mbg cotb nerdvana lobg slicker purge mu tdg liege rahdo dt"
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: audio, mountPath: /work/audio }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: work
              hostPath: { path: /srv/apps/bg-taste-match, type: Directory }
            - name: audio
              hostPath: { path: /var/lib/bg-taste-match/audio, type: Directory }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bg-taste-match-gpu
  namespace: apps
  labels: { app: bg-taste-match }
spec:
  # Running since 2026-11-23 (user: run it with a heat guard): the Acer's GPU runs hot, so heat_guard.py runs inside
  # each stage (HEAT_* below). It pauses the work while the GPU or CPU is hot, ends the pass after 15 minutes of
  # waiting or at once at the hard level, and stops the work if it can't read the temperatures. Paused 11-11 to 11-23
  # after a guard run from another machine died and Whisper ran all day up to GPU 85 C / CPU 92 C.
  # The first killable job (moudimash99/Infra#12): it books almost nothing, so it uses the Acer's spare memory and is
  # the first the kernel kills when that runs out; each stage picks up where it stopped.
  suspend: false
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Pushed out by the scheduler (a batch-make-room job starting): not a failure, the pod is made again. A memory
      # kill (exit 137) still ends the run, so a video too big for the limit is retried at most once an hour.
      podFailurePolicy:
        rules:
          - action: Ignore
            onPodConditions: [{ type: DisruptionTarget }]
      template:
        metadata:
          labels: { app: bg-taste-match, stage: gpu }
        spec:
          restartPolicy: Never
          runtimeClassName: nvidia
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-mid
          containers:
            - name: gpu
              image: docker.io/library/bg-taste-match:2026-11-10a
              imagePullPolicy: Never
              command: ["sh", "/work/deploy/run_gpu.sh"]
              env:
                - name: CHANNELS
                  value: "hc oscs rahdo bgco gbg tbm bgb dtg bower ttgg mvm tantrum amass 3mbg cotb nerdvana lobg slicker purge mu tdg liege dt"
                - { name: SOLO, value: "" }
                # 0 = no length limit: whisper_captions.py transcribes long audio in 10-minute pieces
                - { name: WHISPER_MAX_MINUTES, value: "0" }
                # one GPU job at a time (cat-monitor too): taken per video, see gpu_lock.py
                - { name: GPU_LOCK, value: /gpu-lock/gpu.lock }
                - { name: NVIDIA_VISIBLE_DEVICES, value: all }
                - { name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility" }
                # heat guard (heat_guard.py), degrees C: pause / resume / hard stop, and the longest pause in seconds
                - { name: HEAT_GUARD, value: "1" }
                - { name: HEAT_PAUSE_GPU, value: "80" }
                - { name: HEAT_PAUSE_CPU, value: "90" }
                - { name: HEAT_RESUME_GPU, value: "70" }
                - { name: HEAT_RESUME_CPU, value: "80" }
                - { name: HEAT_HARD_GPU, value: "85" }
                - { name: HEAT_HARD_CPU, value: "95" }
                - { name: HEAT_MAX_WAIT, value: "900" }
                # a stage starts only with this much memory really free on the Acer (deploy/run_gpu.sh)
                - { name: MIN_FREE_MIB, value: "1536" }
                - name: HF_TOKEN
                  valueFrom: { secretKeyRef: { name: bg-taste-match, key: HF_TOKEN } }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: audio, mountPath: /work/audio }
                - { name: gpu-lock, mountPath: /gpu-lock }
              resources:
                # Killable (2026-11-23): books almost nothing, uses ~1-2.5 GiB of spare room (peaks before the
                # 10-minute pieces: 1.0, 1.5, 2.5 GiB), and gets CPU last. 4Gi limit: speaker separation reads a whole
                # video, so it needs more than Whisper.
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 4Gi }
          volumes:
            - name: work
              hostPath: { path: /srv/apps/bg-taste-match, type: Directory }
            - name: audio
              hostPath: { path: /var/lib/bg-taste-match/audio, type: Directory }
            - name: gpu-lock
              hostPath: { path: /srv/apps/gpu-lock, type: DirectoryOrCreate }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bg-taste-match-llm
  namespace: apps
  labels: { app: bg-taste-match }
spec:
  # Nights only, as the PC's night runner did (2026-11-11): the website is the day's writers' and the user's then.
  # run_llm.sh starts no channel from RATE_UNTIL to 20:00, so a long run ends near 09:00 too.
  schedule: "45 0-8,20-23 * * *"
  timeZone: Europe/Paris
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app: bg-taste-match, stage: llm }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-high
          containers:
            - name: llm
              image: docker.io/library/bg-taste-match:2026-11-10a
              imagePullPolicy: Never
              command: ["sh", "/work/deploy/run_llm.sh"]
              env:
                - name: RATE_CHANNELS
                  value: "hc oscs rahdo bgco gbg tbm bgb dtg bower ttgg mvm tantrum amass 3mbg cotb nerdvana lobg slicker purge mu tdg liege dt"
                - { name: RATE_UNTIL, value: "0900" }
                - { name: TZ, value: Europe/Paris }
                # The Gemini website through Free Motion's fm-webllm (k8s/apps/fm-webllm): gemini.py runs fm-llm's
                # web-llm.py (the server's checkout, read over NFS), which sends each ask there. gemini.py asks with
                # WEB_LLM_PRIORITY=low (at most 30 of the hour's 45 calls) and waits out a paced or capped turn.
                - { name: GEMINI_BACKEND, value: web }
                - { name: WEB_LLM_URL, value: "http://fm-webllm:8933" }
                - { name: CAREER_OPS_DIR, value: /fm/ws/fm-llm }
                # Long multi-game videos took up to 12 min on 2026-11-11; fm-webllm stops a call at 290 s otherwise.
                - { name: WEB_LLM_SERVE_TIMEOUT, value: "900" }
                - { name: FM_LLM_PROJECT, value: bg-taste-match }
                - { name: FM_LLM_SPOOL, value: /work/fm-llm-spool }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: fm-ws, mountPath: /fm/ws, readOnly: true }
              resources:
                # Waits on the website most of the time; small, so it fits next to the GPU job and the browser lanes.
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: work
              hostPath: { path: /srv/apps/bg-taste-match, type: Directory }
            - name: fm-ws
              nfs: { server: 192.168.1.116, path: /srv/apps/freemotion/ws, readOnly: true }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-taste-match-shell
  namespace: apps
  labels: { app: bg-taste-match }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: bg-taste-match, stage: shell }
  template:
    metadata:
      labels: { app: bg-taste-match, stage: shell }
    spec:
      nodeSelector: { kubernetes.io/hostname: acer-laptop }
      tolerations:
        - { key: dedicated, value: worker, effect: NoSchedule }
      priorityClassName: batch-low
      containers:
        - name: shell
          image: docker.io/library/bg-taste-match:2026-11-10a
          imagePullPolicy: Never
          command: ["sleep", "infinity"]
          env:
            - { name: GEMINI_BACKEND, value: fm }
            - { name: FM_LLM_URL, value: "http://192.168.1.116:8792" }
            - { name: FM_LLM_MODEL, value: gemini-pro }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: audio, mountPath: /work/audio }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: work
          hostPath: { path: /srv/apps/bg-taste-match, type: Directory }
        - name: audio
          hostPath: { path: /var/lib/bg-taste-match/audio, type: Directory }
