# Free Motion's controller (2026-11-10): every script and every driver CLI in one container, as they ran on one
# Windows PC, so its process-id locks, /tmp tracker lock, process kills and driver HOME readers keep working.
# `scheduled.mjs daemon` (fm-orchestrator) is the main process, in place of Task Scheduler. The browsers are the
# fm-browser pods; the drivers reach them over HTTP, and fm-data is the same path in both (NFS for the workers).
#
# Image: docker.io/library/fm:<date>, built on the server from images/fm and loaded by hand (no registry pull yet).
# Code: the fm-* repos checked out at /srv/apps/freemotion/ws (deploy: git pull there, between rounds).
# Data: /srv/apps/freemotion/fm-data (exported to the Acer by NFS). Drivers' logins and transcripts: /srv/apps/freemotion/home.
# Settings come from fm-data/.env as on the PC; HUB_URL is set here to the hub's Service, HUB_MACHINE stays "pc" so
# the dashboard's records carry on as one machine.
#
# replicas: 1 since the cut-over (2026-11-11). The PC must never run Free Motion at the same time (two writers of the
# never-apply-twice ledger): it is blocked by ~/.fm-moved.json. Memory: at most 4 GiB (below).
#
# A stop drains (fm-orchestrator freemotion-night/drain.mjs, review 2026-11-27 recommendation 2): a rollout, an apply, a
# node drain or `kubectl delete pod` no longer kills the round. The daemon raises the stop files, each lane ends the
# job in hand and takes no new one, no round starts, and the daemon exits once the round and any ledger or tracker
# write are over. A job still running at FM_DRAIN_SECONDS is stopped and recorded as cut off ("check before any
# retry"). The next start removes the drain's stop files, and auto-apply goes on by itself. So `kubectl rollout status`
# can take up to the full deadline, and the pod shows Terminating meanwhile. A memory kill, a power cut or
# `--grace-period=0 --force` still kills outright.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fm-controller
  namespace: apps
  labels: { app: fm-controller }
  # Flux leaves this alone (Infra#7): a change restarts it. Since the drain (above) a restart ends at a job boundary,
  # so it could go back under Flux; until the owner decides, it is applied by hand, at any time.
  annotations: { kustomize.toolkit.fluxcd.io/reconcile: disabled }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one ledger, one set of locks: never two controllers
  selector:
    matchLabels: { app: fm-controller }
  template:
    metadata:
      labels: { app: fm-controller }
    spec:
      nodeSelector: { kubernetes.io/hostname: moudimash99 }
      automountServiceAccountToken: false   # its drivers have a shell and read untrusted pages
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      # The drain's time (above): FM_DRAIN_SECONDS (env, below) plus 2 minutes for the cut and the exit. Change the two
      # together. 30 minutes because a driver may take 25 for the job in hand (run.sh JOB_MAX). Was 60, never used:
      # the daemon had no stop handler.
      terminationGracePeriodSeconds: 1800
      containers:
        - name: controller
          image: docker.io/library/fm:2026-11-26a   # Node Playwright's Chromium 1248 for the live check (Infra 6de552c)
          imagePullPolicy: Never
          # The image's entrypoint, with tini but without its -g: the stop signal goes to the daemon alone, which drains.
          # With -g (the Dockerfile's ENTRYPOINT, kept for the browser pods) it also reached Xvfb, which entrypoint.sh
          # starts in the same process group, so the display went while the lanes still worked.
          command: ["/usr/bin/tini", "--", "/usr/local/lib/fm/entrypoint.sh"]
          args: ["controller"]
          env:
            # The one setting for a stop: how long a drain may take, in seconds (28 min). At the end a job still in hand
            # is cut off. The grace period above is this plus 120.
            - { name: FM_DRAIN_SECONDS, value: "1680" }
            - { name: FM_WS, value: /fm/ws }
            - { name: FM_DATA_DIR, value: /fm/fm-data }
            - { name: HOME, value: /fm/home }
            - { name: HUB_URL, value: "http://freemotion-hub.apps.svc.cluster.local:8791" }
            - { name: HUB_MACHINE, value: pc }
            # The lanes' browsers: run.sh gives each lane one ready fm-browser pod (fm-browser.yaml), and fm setup --machine
            # then writes no local browser for codex (it could not take a remote one over it).
            - { name: FM_BROWSER_SERVICE, value: fm-browser.apps.svc.cluster.local }
            # The website writers: never a browser here (a ChatGPT one took 1.4 GB and, with the score loops, got the
            # controller OOM-killed on 2026-11-11 19:45). Every web-llm.py ask goes to the Acer's fm-webllm pod, which
            # holds the signed-in ChatGPT browser and the Gemini cookies (Gemini on by the user, 2026-11-11 23:10).
            # Both were OFF from 2026-11-11 21:57 to 2026-11-27 (WEB_LLM_OFF=1): Gemini's step hung there, and ChatGPT
            # went off with it although nothing was wrong with it (the user: it should not have been).
            # ChatGPT ON since 2026-11-27 ~01:10 (user): a test ask answered in 92 s, the helper's start included.
            # Gemini ON again since 2026-11-27 (user), after fm-llm#4 was fixed (fm-llm f999392: every Google cookie
            # sent, stale cookies re-read from the profile): a test ask answered in 16 s. WEB_LLM_OFF=gemini turns it
            # off again; apply between rounds.
            - { name: WEB_LLM_URL, value: "http://fm-webllm.apps.svc.cluster.local:8933" }
          securityContext: { allowPrivilegeEscalation: false, privileged: false }
          volumeMounts:
            - { name: ws, mountPath: /fm/ws }
            - { name: data, mountPath: /fm/fm-data }
            - { name: home, mountPath: /fm/home }
            - { name: shm, mountPath: /dev/shm }
          resources:
            # Booked at what it really uses (2026-11-23): 1.45 GiB between rounds, 2.2 GiB median, 3.07 GiB peak over a
            # full day. With 1Gi the scheduler saw ~5 GiB free on the server when ~1 GiB really was.
            requests: { cpu: 500m, memory: 3Gi }
            # 3 GiB was too little: a round's job list (~1.2 GB) with the hub agent (0.5 GB) and three score loops
            # (1.3 GB) reached it (2026-11-11). An OOM kill takes the whole container, round and all.
            limits: { memory: 4Gi }
      volumes:
        - name: ws
          hostPath: { path: /srv/apps/freemotion/ws, type: Directory }
        - name: data
          hostPath: { path: /srv/apps/freemotion/fm-data, type: Directory }
        - name: home
          hostPath: { path: /srv/apps/freemotion/home, type: Directory }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
