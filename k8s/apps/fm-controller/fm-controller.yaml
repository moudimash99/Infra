# Free Motion's controller (2026-11-10): every script and every driver CLI in one container, as they ran on one
# Windows PC, so its process-id locks, /tmp tracker lock, process kills and driver HOME readers keep working.
# `scheduled.mjs daemon` (fm-orchestrator) is the main process, in place of Task Scheduler. The browsers are the
# fm-browser pods; the drivers reach them over HTTP, and fm-data is the same path in both (NFS for the workers).
#
# Image: docker.io/library/fm:<date>, built on the server from images/fm and loaded by hand (no registry pull yet).
# Code: the fm-* repos checked out at /srv/apps/freemotion/ws (deploy: git pull there, between rounds).
# Data: /srv/apps/freemotion/fm-data (exported to the Acer by NFS). Drivers' logins and transcripts: /srv/apps/freemotion/home.
# Settings come from fm-data/.env as on the PC; HUB_URL is set here to the hub's Service, HUB_MACHINE stays "pc" so
# the dashboard's records carry on as one machine.
#
# replicas: 1 since the cut-over (2026-11-11). The PC must never run Free Motion at the same time (two writers of the
# never-apply-twice ledger): it is blocked by ~/.fm-moved.json. Memory: at most 4 GiB (below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fm-controller
  namespace: apps
  labels: { app: fm-controller }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one ledger, one set of locks: never two controllers
  selector:
    matchLabels: { app: fm-controller }
  template:
    metadata:
      labels: { app: fm-controller }
    spec:
      nodeSelector: { kubernetes.io/hostname: moudimash99 }
      automountServiceAccountToken: false   # its drivers have a shell and read untrusted pages
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      terminationGracePeriodSeconds: 60
      containers:
        - name: controller
          image: docker.io/library/fm:2026-11-10a
          imagePullPolicy: Never
          args: ["controller"]
          env:
            - { name: FM_WS, value: /fm/ws }
            - { name: FM_DATA_DIR, value: /fm/fm-data }
            - { name: HOME, value: /fm/home }
            - { name: HUB_URL, value: "http://freemotion-hub.apps.svc.cluster.local:8791" }
            - { name: HUB_MACHINE, value: pc }
            # The lanes' browsers: run.sh gives each lane one ready fm-browser pod (fm-browser.yaml), and fm setup --machine
            # then writes no local browser for codex (it could not take a remote one over it).
            - { name: FM_BROWSER_SERVICE, value: fm-browser.apps.svc.cluster.local }
            # The website writers: never a browser here (a ChatGPT one took 1.4 GB and, with the score loops, got the
            # controller OOM-killed on 2026-11-11 19:45). Every web-llm.py ask goes to the Acer's fm-webllm pod, which
            # holds the signed-in ChatGPT browser and the Gemini cookies (Gemini on by the user, 2026-11-11 23:10).
            - { name: WEB_LLM_URL, value: "http://fm-webllm.apps.svc.cluster.local:8933" }
          securityContext: { allowPrivilegeEscalation: false, privileged: false }
          volumeMounts:
            - { name: ws, mountPath: /fm/ws }
            - { name: data, mountPath: /fm/fm-data }
            - { name: home, mountPath: /fm/home }
            - { name: shm, mountPath: /dev/shm }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            # 3 GiB was too little: a round's job list (~1.2 GB) with the hub agent (0.5 GB) and three score loops
            # (1.3 GB) reached it (2026-11-11). An OOM kill takes the whole container, round and all.
            limits: { memory: 4Gi }
      volumes:
        - name: ws
          hostPath: { path: /srv/apps/freemotion/ws, type: Directory }
        - name: data
          hostPath: { path: /srv/apps/freemotion/fm-data, type: Directory }
        - name: home
          hostPath: { path: /srv/apps/freemotion/home, type: Directory }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
