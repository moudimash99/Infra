# lab.machaka.net/mail-review: on demand, the open-items review of the last 30 days of mail (Email-remove
# open_review.py), emailed to the user. Two buttons (job search / everything) start a Job from the suspended CronJob
# below; the review runs on the Acer beside the Gmail archiver (same folder /srv/apps/email-remove and Secret
# email-remove) and asks the models through the llm-gateway. Asked for by the user on 2026-11-24.
#  - mail-open-review: the Job template only (suspend: true, never on a schedule). Rank batch-high like the archiver:
#    waits for room on the Acer, never pushes anyone out. 15-25 min, counts only in its log.
#  - mail-review-button: the page (stdlib Python, its code is the ConfigMap below; no image to build), on the server.
#    It checks the Cloudflare Access token itself and may only create Jobs and read this one CronJob in apps.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mail-open-review
  namespace: apps
  labels: { app: mail-open-review }
spec:
  schedule: "0 0 1 1 *"   # never used: suspended; the button creates the Jobs
  suspend: true
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800   # a week of runs on the page
      template:
        metadata:
          labels: { app: mail-open-review }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-high
          automountServiceAccountToken: false
          securityContext: { runAsUser: 1000, runAsGroup: 1000 }
          containers:
            - name: review
              image: docker.io/library/python:3.13-slim
              imagePullPolicy: IfNotPresent
              command: [python, open_review.py]
              args: [--scope, jobs]   # the button sets --scope jobs or --scope all
              workingDir: /app
              envFrom:
                - secretRef: { name: email-remove }
              env:
                - { name: TZ, value: Europe/Paris }
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
                - { name: PYTHONIOENCODING, value: utf-8 }
                - { name: FM_LLM_ASK, value: "http://192.168.1.116:8792/v1/ask" }
              securityContext: { allowPrivilegeEscalation: false, privileged: false }
              volumeMounts:
                - { name: app, mountPath: /app, readOnly: true }
                - { name: zoneinfo, mountPath: /usr/share/zoneinfo, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: app
              hostPath: { path: /srv/apps/email-remove, type: Directory }
            - name: zoneinfo
              hostPath: { path: /usr/share/zoneinfo, type: Directory }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mail-review-button
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mail-review-button
  namespace: apps
rules:
  - { apiGroups: [batch], resources: [cronjobs], resourceNames: [mail-open-review], verbs: [get] }
  - { apiGroups: [batch], resources: [jobs], verbs: [list, create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mail-review-button
  namespace: apps
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: mail-review-button }
subjects:
  - { kind: ServiceAccount, name: mail-review-button, namespace: apps }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-review-button
  namespace: apps
data:
  button.py: |
    """lab.machaka.net/mail-review: two buttons that start the open-items mail review (Email-remove open_review.py) as a
    Job from the suspended CronJob apps/mail-open-review, and the last runs. Standard library only (python:3.13-slim).

    Every request but /mail-review/healthz needs a valid Cloudflare Access token (header Cf-Access-Jwt-Assertion or
    cookie CF_Authorization, RS256, signed by the team's keys, for ACCESS_AUD, not expired): Traefik can be reached from
    the home network without the login. A POST must also come from this page (Origin / Sec-Fetch-Site), and is refused
    while a run is going. The Job's log has counts only; the review itself goes by email.
    """
    import base64
    import hashlib
    import html
    import json
    import logging
    import os
    import ssl
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs

    TEAM = os.environ.get("ACCESS_TEAM", "").strip()
    AUDS = {a.strip() for a in os.environ.get("ACCESS_AUD", "").split(",") if a.strip()}
    HOST = os.environ.get("PUBLIC_HOST", "lab.machaka.net")
    NS = os.environ.get("NAMESPACE", "apps")
    CRONJOB = os.environ.get("CRONJOB", "mail-open-review")
    BASE = "/mail-review"
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = "https://kubernetes.default.svc"
    SCOPES = {"jobs": "Job search", "all": "Everything"}
    log = logging.getLogger("mail-review")


    # ---------- the Access token ----------

    _keys, _keys_at, _lock = {}, 0.0, threading.Lock()
    _good = {}
    # DER prefix of a SHA-256 DigestInfo (RFC 8017, EMSA-PKCS1-v1_5)
    SHA256_PREFIX = bytes.fromhex("3031300d060960864801650304020105000420")


    def _b64(text):
        return base64.urlsafe_b64decode(text + "=" * (-len(text) % 4))


    def _key(kid):
        global _keys, _keys_at
        with _lock:
            if kid not in _keys and time.time() - _keys_at > 300:
                _keys_at = time.time()
                try:
                    with urllib.request.urlopen(f"https://{TEAM}/cdn-cgi/access/certs", timeout=5) as r:
                        _keys = {k["kid"]: (int.from_bytes(_b64(k["n"]), "big"), int.from_bytes(_b64(k["e"]), "big"))
                                 for k in json.load(r).get("keys", []) if k.get("kty") == "RSA" and k.get("kid")}
                except Exception as e:
                    log.warning("Access keys unreadable: %s", e)
            return _keys.get(kid)


    def valid(token):
        """True when `token` is a good Access token for us."""
        if not token or not TEAM or not AUDS:
            return False
        if _good.get(token, 0) > time.time():
            return True
        try:
            head64, body64, sig64 = token.split(".")
            head, claims = json.loads(_b64(head64)), json.loads(_b64(body64))
            if head.get("alg") != "RS256":
                return False
            key = _key(head.get("kid"))
            if not key:
                return False
            n, e = key
            size = (n.bit_length() + 7) // 8
            em = pow(int.from_bytes(_b64(sig64), "big"), e, n).to_bytes(size, "big")
            digest = hashlib.sha256(f"{head64}.{body64}".encode()).digest()
            expected = b"\x00\x01" + b"\xff" * (size - len(SHA256_PREFIX) - len(digest) - 3) + b"\x00" + SHA256_PREFIX + digest
            aud = claims.get("aud")
            aud = set(aud) if isinstance(aud, list) else {aud}
            if (em != expected or claims.get("iss") != f"https://{TEAM}" or not aud & AUDS
                    or not float(claims.get("exp", 0)) > time.time()):
                return False
        except Exception:
            return False
        if len(_good) > 200:
            _good.clear()
        _good[token] = float(claims["exp"])
        return True


    # ---------- the Kubernetes API ----------

    def k8s(method, path, body=None):
        with open(f"{SA}/token") as f:
            token = f.read().strip()
        req = urllib.request.Request(API + path, method=method, data=json.dumps(body).encode() if body else None,
                                     headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
        with urllib.request.urlopen(req, context=ssl.create_default_context(cafile=f"{SA}/ca.crt"), timeout=10) as r:
            return json.load(r)


    def runs():
        items = k8s("GET", f"/apis/batch/v1/namespaces/{NS}/jobs?labelSelector=app%3D{CRONJOB}")["items"]
        return sorted(items, key=lambda j: j["metadata"]["creationTimestamp"], reverse=True)


    def active(job):
        s = job.get("status", {})
        return not s.get("succeeded") and not s.get("failed") and not any(
            c.get("type") in ("Complete", "Failed") and c.get("status") == "True" for c in s.get("conditions", []))


    def start(scope):
        cj = k8s("GET", f"/apis/batch/v1/namespaces/{NS}/cronjobs/{CRONJOB}")
        spec = cj["spec"]["jobTemplate"]["spec"]
        spec["template"]["spec"]["containers"][0]["args"] = ["--scope", scope]
        labels = {**spec["template"].get("metadata", {}).get("labels", {}), "app": CRONJOB, "scope": scope}
        spec["template"].setdefault("metadata", {})["labels"] = labels
        job = {"apiVersion": "batch/v1", "kind": "Job",
               "metadata": {"generateName": f"{CRONJOB}-{scope}-", "namespace": NS, "labels": labels,
                            "annotations": {"cronjob.kubernetes.io/instantiate": "manual"},
                            "ownerReferences": [{"apiVersion": "batch/v1", "kind": "CronJob", "name": CRONJOB,
                                                 "uid": cj["metadata"]["uid"], "controller": True}]},
               "spec": spec}
        return k8s("POST", f"/apis/batch/v1/namespaces/{NS}/jobs", job)["metadata"]["name"]


    # ---------- the page ----------

    PAGE = """<!doctype html><html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail review</title>{refresh}
    <style>
    :root{{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5d6672;--line:#dde1e6;--accent:#2f6fde;--ok:#2e7d4f;--bad:#c23b3b}}
    @media (prefers-color-scheme:dark){{:root{{--bg:#14171b;--card:#1d2126;--text:#e6e9ed;--muted:#9aa3ad;--line:#2d333a;--accent:#6ea0ff;--ok:#5cc28a;--bad:#ef7a7a}}}}
    body{{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}}
    main{{max-width:40rem;margin:0 auto;padding:1.5rem 1rem}}
    h1{{font-size:1.4rem;margin:0 0 .25rem}} p{{color:var(--muted);margin:.25rem 0 1.25rem}}
    .buttons{{display:grid;gap:.75rem;grid-template-columns:1fr 1fr}}
    button{{width:100%;padding:1rem .75rem;border:0;border-radius:.6rem;background:var(--accent);color:#fff;font:600 1rem system-ui;cursor:pointer}}
    button small{{display:block;font-weight:400;opacity:.85;margin-top:.2rem}}
    button:disabled{{opacity:.45;cursor:default}}
    .note{{background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.75rem 1rem;margin:1rem 0}}
    table{{width:100%;border-collapse:collapse;margin-top:.5rem;background:var(--card);border-radius:.6rem;overflow:hidden}}
    td,th{{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--line);font-size:.92rem}}
    th{{color:var(--muted);font-weight:500}} .ok{{color:var(--ok)}} .bad{{color:var(--bad)}}
    @media (max-width:420px){{.buttons{{grid-template-columns:1fr}}}}
    </style></head><body><main>
    <h1>Mail review</h1>
    <p>What is still open in the last 30 days of mail, in all three accounts: to do, coming up, waiting on someone, missed.
    The answer comes by email in about 15-25 minutes.</p>
    {note}
    <form method="post" action="{base}/run" class="buttons">
    <button name="scope" value="jobs"{disabled}>Job search<small>interviews, recruiters, tests</small></button>
    <button name="scope" value="all"{disabled}>Everything<small>jobs first, then bills, admin, people</small></button>
    </form>
    <h2 style="font-size:1.05rem;margin-top:1.75rem">Last runs</h2>
    {table}
    </main></body></html>"""


    def _ago(stamp):
        t = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
        return t.astimezone().strftime("%a %d %b %H:%M")


    def page(note=""):
        try:
            items = runs()
        except Exception as e:
            log.warning("Jobs unreadable: %s", e)
            items, note = [], note + '<div class="note bad">The runs could not be read.</div>'
        busy = any(active(j) for j in items)
        if busy:
            note += '<div class="note">A review is running. This page refreshes by itself; the email follows.</div>'
        rows = []
        for j in items[:8]:
            s = j.get("status", {})
            state = ('<span class="ok">sent</span>' if s.get("succeeded") else '<span class="bad">failed</span>'
                     if s.get("failed") else "running")
            took = ""
            if s.get("startTime") and s.get("completionTime"):
                secs = (datetime.fromisoformat(s["completionTime"].replace("Z", "+00:00"))
                        - datetime.fromisoformat(s["startTime"].replace("Z", "+00:00"))).total_seconds()
                took = f"{secs / 60:.0f} min"
            scope = SCOPES.get(j["metadata"].get("labels", {}).get("scope"), "?")
            rows.append(f"<tr><td>{_ago(j['metadata']['creationTimestamp'])}</td><td>{scope}</td><td>{state}</td><td>{took}</td></tr>")
        table = ("<table><tr><th>Started</th><th>Review</th><th>Result</th><th>Took</th></tr>" + "".join(rows) + "</table>"
                 if rows else "<p>None yet.</p>")
        return PAGE.format(refresh='<meta http-equiv="refresh" content="30">' if busy else "", note=note, base=BASE,
                           disabled=" disabled" if busy else "", table=table).encode()


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            pass

        def _token(self):
            token = self.headers.get("Cf-Access-Jwt-Assertion", "")
            if not token:
                for part in self.headers.get("Cookie", "").split(";"):
                    k, _, v = part.strip().partition("=")
                    if k == "CF_Authorization":
                        token = v
            return token

        def _send(self, code, body=b"", kind="text/html; charset=utf-8", location=None):
            self.send_response(code)
            self.send_header("Content-Type", kind)
            self.send_header("Cache-Control", "no-store")
            self.send_header("X-Frame-Options", "DENY")
            if location:
                self.send_header("Location", location)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            path = self.path.split("?")[0]
            if path == BASE + "/healthz":
                return self._send(200, b"ok", "text/plain")
            if not valid(self._token()):
                return self._send(403, b"Login needed: open this page through lab.machaka.net.", "text/plain")
            if path in (BASE, BASE + "/"):
                note = ""
                if "started" in self.path:
                    note = '<div class="note ok">Started. The email follows when it is done.</div>'
                elif "busy" in self.path:
                    note = '<div class="note">A review is already running: wait for its email.</div>'
                return self._send(200, page(note))
            self._send(404, b"Not found", "text/plain")

        def do_POST(self):
            if self.path.split("?")[0] != BASE + "/run":
                return self._send(404, b"Not found", "text/plain")
            if not valid(self._token()):
                return self._send(403, b"Login needed.", "text/plain")
            origin = self.headers.get("Origin", "")
            site = self.headers.get("Sec-Fetch-Site", "")
            if origin != f"https://{HOST}" and site != "same-origin":
                return self._send(403, b"Only from the page itself.", "text/plain")
            length = min(int(self.headers.get("Content-Length") or 0), 1000)
            scope = parse_qs(self.rfile.read(length).decode("latin-1")).get("scope", [""])[0]
            if scope not in SCOPES:
                return self._send(400, b"Unknown review.", "text/plain")
            try:
                if any(active(j) for j in runs()):
                    return self._send(303, location=f"{BASE}/?busy")
                name = start(scope)
                log.info("Started %s", name)
            except Exception as e:
                log.error("Could not start a run: %s", e)
                return self._send(500, page('<div class="note bad">The review could not be started.</div>'))
            self._send(303, location=f"{BASE}/?started")


    if __name__ == "__main__":
        logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-review-button
  namespace: apps
  labels: { app: mail-review-button }
spec:
  replicas: 1
  selector: { matchLabels: { app: mail-review-button } }
  template:
    metadata:
      labels: { app: mail-review-button }
    spec:
      serviceAccountName: mail-review-button
      nodeSelector: { kubernetes.io/hostname: moudimash99 }
      priorityClassName: homelab-normal
      securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true }
      containers:
        - name: button
          image: docker.io/library/python:3.13-slim
          imagePullPolicy: IfNotPresent
          command: [python, /code/button.py]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: ACCESS_TEAM, value: hannibalproto.cloudflareaccess.com }
            - { name: ACCESS_AUD, value: "8209dd48ce99a02ac8c20f6195860c5dae30315d4361346cfcc8a8f0e56b2e9e" }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          readinessProbe:
            httpGet: { path: /mail-review/healthz, port: http }
          livenessProbe:
            httpGet: { path: /mail-review/healthz, port: http }
            periodSeconds: 60
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
            - { name: zoneinfo, mountPath: /usr/share/zoneinfo, readOnly: true }
      volumes:
        - name: code
          configMap: { name: mail-review-button }
        - name: zoneinfo
          hostPath: { path: /usr/share/zoneinfo, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: mail-review-button
  namespace: apps
spec:
  selector: { app: mail-review-button }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Beside Homepage on lab.machaka.net (already behind the Cloudflare login): Traefik sends the longer path here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-review-button
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: lab.machaka.net
      http:
        paths:
          - path: /mail-review
            pathType: Prefix
            backend:
              service: { name: mail-review-button, port: { name: http } }
