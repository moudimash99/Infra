# machaka.net and mohammad.machaka.net: personal website (Next.js) with the CV link tracking.
# Image: the one the Docker copy ran on 2026-10-24 (~/Personal-Website), loaded into k3s by hand.
# ADMIN_KEY is in the Secret website-env, made on the server from ~/Personal-Website/.env;
# it is not in this repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: apps
  labels: { app: website }
spec:
  replicas: 1
  strategy: { type: Recreate }  # tracking data in files: never two copies at once
  selector:
    matchLabels: { app: website }
  template:
    metadata:
      labels: { app: website }
    spec:
      nodeSelector: { kubernetes.io/hostname: moudimash99 }
      containers:
        - name: website
          image: docker.io/library/personal-website:2026-10-24
          imagePullPolicy: Never
          env:
            - { name: NODE_ENV, value: production }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
            - { name: PORT, value: "3000" }
            - { name: TRACKING_DIR, value: /app/tracking-data }
          envFrom:
            - secretRef: { name: website-env }
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: tracking, mountPath: /app/tracking-data }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tracking
          hostPath: { path: /home/moudimash99/Personal-Website/tracking-data, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: apps
spec:
  selector: { app: website }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: machaka.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: website, port: { name: http } }
    - host: mohammad.machaka.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: website, port: { name: http } }
