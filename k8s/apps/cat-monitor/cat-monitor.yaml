# The nightly feeding monitor (CronJob cat-monitor) was removed on 2026-11-24 (user): cat detection moves into the live
# Frigate with the Simba/Nala model (Cat-Camera#7, #10). Its reports stay in /srv/apps/cat-monitor.
# Flash of the day (catcam.machaka.net): daily_flash.py takes the day's Simba/Nala sightings from Frigate (its detector
# runs the cats' model since 2026-11-25) and stitches those moments from the recordings into a short captioned video
# in /srv/apps/cat-monitor/flash. No model of its own since 2026-11-25. 19:20 builds today so far, 00:20 the whole of
# yesterday. CPU only. Code from the hostPath /srv/apps/cat-monitor/code (copied from the Cat-Camera repo).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cat-flash
  namespace: apps
  labels: { app: cat-monitor }
spec:
  schedule: "20 0,19 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app: cat-monitor, stage: flash }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-make-room   # may stop the mail classifier for its ~4 minutes (2026-11-20)
          containers:
            - name: flash
              image: docker.io/library/cat-monitor:2026-11-10a
              imagePullPolicy: Never
              command: ["python", "daily_flash.py", "--auto"]
              workingDir: /app/code
              env:
                - { name: FLASH_DIR, value: /data/flash }
                - { name: FRIGATE_RECORDINGS, value: /recordings }
                - { name: FRIGATE_URL, value: "http://192.168.1.93:5000" }
                - { name: YOLO_CONFIG_DIR, value: /tmp }
                - { name: OMP_NUM_THREADS, value: "3" }    # leave a thread for Frigate
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: code, mountPath: /app/code, readOnly: true }
                - { name: recordings, mountPath: /recordings, readOnly: true }
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits: { memory: 2560Mi }
          volumes:
            - name: data
              hostPath: { path: /srv/apps/cat-monitor, type: DirectoryOrCreate }
            - name: recordings
              hostPath: { path: /var/lib/frigate/media/recordings, type: Directory }
            - name: code
              hostPath: { path: /srv/apps/cat-monitor/code, type: Directory }
