# Free Motion hub: the dashboard's server (fm-orchestrator/freemotion-hub/server.mjs) with fm-web's page.
# Moved from Docker on the server (~/freemotion-hub, container `freemotion`) on 2026-11-10.
#
# Image: always the tag `live`, built on the server and loaded into k3s by fm-orchestrator's
# freemotion-hub/test/deploy.mjs, the only way a dashboard change goes live. It runs the e2e tests first, keeps each build
# under a dated tag too, restarts this Deployment and checks that the pod serves the files it tested. Applying this file
# never changes the code. The first `live` was the Docker hub's own image (also tagged 2026-11-01-docker).
# Back to an earlier build, on the server:
#   docker tag freemotion-hub:<tag> freemotion-hub:live && docker save freemotion-hub:live | sudo k3s ctr images import -
#   sudo k3s kubectl -n apps rollout restart deploy/freemotion-hub
#
# Settings: Secret freemotion-hub (AGENT_KEYS, CF_TEAM, CF_AUD, ALLOWED_EMAILS), made on the server from the old .env:
#   sudo k3s kubectl -n apps create secret generic freemotion-hub --from-env-file=$HOME/freemotion-hub/.env
#
# Reached by:
#   the page    freemotion.machaka.net: Cloudflare (Access login) → nginx → Traefik → this Ingress; the app checks the login too
#   the agents  port 8791 on the server (hostPort), at its Tailscale address 100.111.127.103 (the agents' HUB_URL)
#
# Data: /srv/apps/freemotion-hub/hub.db on the server (SQLite; never two hubs on it). The hub never closes its database, so
# a stopped pod leaves hub.db-wal behind: copy hub.db only together with its -wal, or with VACUUM INTO.
#
# Back to Docker: scale this to 0; copy hub.db (VACUUM INTO) into the volume freemotion-hub_freemotion-data with the
# container stopped, its old hub.db-wal/-shm removed; docker start freemotion; nginx back to http://freemotion:8790.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freemotion-hub
  namespace: apps
  labels: { app: freemotion-hub }
spec:
  replicas: 1
  strategy: { type: Recreate }  # one SQLite file, and one hostPort: never two copies at once
  selector:
    matchLabels: { app: freemotion-hub }
  template:
    metadata:
      labels: { app: freemotion-hub }
    spec:
      nodeSelector: { kubernetes.io/hostname: moudimash99 }
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }   # the image's user `node`; owns /srv/apps/freemotion-hub
      containers:
        - name: hub
          image: docker.io/library/freemotion-hub:live
          imagePullPolicy: Never
          envFrom:
            - secretRef: { name: freemotion-hub }
          ports:
            - { name: page, containerPort: 8790 }
            - { name: agent, containerPort: 8791, hostPort: 8791 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: page }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: page }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }   # as in the old compose.yml
      volumes:
        - name: data
          hostPath: { path: /srv/apps/freemotion-hub, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: freemotion-hub
  namespace: apps
spec:
  selector: { app: freemotion-hub }
  ports:
    - { name: page, port: 8790, targetPort: page }
    - { name: agent, port: 8791, targetPort: agent }   # fm-controller's agent, inside the cluster
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freemotion-hub
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: freemotion.machaka.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: freemotion-hub, port: { name: page } }
