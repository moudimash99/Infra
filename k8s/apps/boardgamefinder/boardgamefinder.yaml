# BoardGameFinder: the daily board game deal search (Okkazeo listings, BGG ranks, prices, deal email). Was the PC's
# scheduled task BoardGameFinder_DailyRun at 07:00. Image built on the server from the BoardGameFinder repo (Dockerfile
# there) and imported by hand (no registry). LLM steps go to fm-llm on the control node; until it exists they fail,
# and the pipeline treats them as non-critical.
# Secret (not in this repo), from the repo's .env: kubectl -n apps create secret generic boardgamefinder --from-env-file=.env
#
# Two CronJobs since 2026-11-22 (the user's design). Okkazeo has served the Acer a bare page since 2026-11-21, after
# about 1,100 page loads in 40 minutes, so Okkazeo is no longer read in one burst:
#   boardgamefinder-fetch  10:00-04:00  one page load at a time, spread over the window (one every ~35 s), saved under
#                                       data/fetch; never writes Games.db. 128 MiB booked (since 2026-11-24).
#   boardgamefinder        04:30        the nightly pipeline: reads the saved pages into Games.db (parse_pages), BGG,
#                                       deals, the deal email around 05:30. Loads no Okkazeo page (BGF_NO_OKKAZEO=1).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boardgamefinder
  namespace: apps
  labels: { app: boardgamefinder }
spec:
  schedule: "30 4 * * *"
  timeZone: Europe/Paris
  # A run that can't start within the hour is skipped, so resuming the job never starts a run in the daytime.
  startingDeadlineSeconds: 3600
  # Paused on purpose from 2026-11-22 for 3 days (the user's call), to let Okkazeo's block lapse. A PC scheduled task
  # resumes both jobs on 2026-11-25 15:00 (fetch starts at once, first nightly run 11-26 04:30) and emails a report.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 18000   # 5 h; it takes about 1
      template:
        metadata:
          labels: { app: boardgamefinder }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          # May stop the mail classifier to start; at 04:30 the fetcher has ended, so 512 MiB usually fits without.
          priorityClassName: batch-make-room
          containers:
            - name: pipeline
              image: docker.io/library/boardgamefinder:2026-11-22c
              imagePullPolicy: Never
              envFrom:
                - secretRef: { name: boardgamefinder }
              env:
                - { name: FM_LLM_URL, value: "http://192.168.1.116:8792" }
                - { name: BGF_NO_OKKAZEO, value: "1" }   # any Okkazeo page load raises; Okkazeo hosts don't resolve
              volumeMounts:
                - { name: data, mountPath: /app/data }
                - { name: log, mountPath: /app/Log }
              resources:
                requests: { cpu: 200m, memory: 512Mi }   # one Chromium, for the deal screenshot only
                limits: { memory: 2Gi }
          volumes:
            - name: data
              hostPath: { path: /srv/apps/boardgamefinder/data, type: Directory }
            - name: log
              hostPath: { path: /srv/apps/boardgamefinder/Log, type: DirectoryOrCreate }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boardgamefinder-fetch
  namespace: apps
  labels: { app: boardgamefinder-fetch }
spec:
  schedule: "0 10 * * *"
  timeZone: Europe/Paris
  # Started late (a reboot, the resume) it still ends at 04:00 and spreads what is left over the time left, never
  # faster than one load per 20 s. Later than 16:00 the day is skipped.
  startingDeadlineSeconds: 21600
  suspend: true   # paused with the nightly job, see above
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 66600   # 18.5 h; it stops itself at 04:00
      # A push-out (memory eviction on the Acer, DisruptionTarget) is not a failure since 2026-11-24: the pod is made
      # again and, started late, spreads what is left of the day over the time left (after 16:00 it skips the day).
      podFailurePolicy:
        rules:
          - action: Ignore
            onPodConditions: [{ type: DisruptionTarget }]
      template:
        metadata:
          labels: { app: boardgamefinder-fetch }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          # batch-high, not batch-mid: cat flash (batch-make-room, 1 GiB at 19:20 and 00:20) stops the lowest pods
          # first, and a fetcher stopped mid-day loses the rest of its day. batch-high is never stopped by a job and
          # never stops anyone. Since 2026-11-24 it books low (below), so it fits next to the small jobs instead of
          # waiting for room; when the Acer's real memory runs low it is pushed out after the lower ranks.
          priorityClassName: batch-high
          containers:
            - name: fetch
              image: docker.io/library/boardgamefinder:2026-11-22c
              imagePullPolicy: Never
              command: ["python", "scripts/fetch_pages.py"]
              volumeMounts:
                - { name: data, mountPath: /app/data }
              resources:
                # One Chromium without images, restarted every 50 loads: ~310 MB fresh (test runs peaked at 482 and
                # 637 MiB). It reads the database read-only, once, at the start. Booked 128Mi, below its use on
                # purpose (user, 2026-11-24; was 384Mi): the Acer is ~97% booked and it runs 18 h a day.
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: data
              hostPath: { path: /srv/apps/boardgamefinder/data, type: Directory }
