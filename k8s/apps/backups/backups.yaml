# Nightly backups of the app data (Infra#10, user 2026-11-23: "move the Acer to the server and the server to the Acer").
#  - backup-server (server, 02:40 Paris): consistent copies of the server's data into /srv/backups/nightly/server/<day>.
#  - backup-acer (Acer, 03:20 Paris): the Acer's data into the server's /srv/backups/nightly/acer/<day> (NFS export,
#    all writes as uid 1000), then the server's latest night copied onto the Acer's own disk,
#    /var/backups/nightly/server/<day>.
# So each machine's data lives on both. SQLite files are copied with SQLite's backup API (safe while the app writes,
# WAL included), never with cp; other files are tar.gz. The last 7 nights are kept in each place.
# Private: the email archiver's files (email text) are in these copies. Folders 700, files 600, owned by uid 1000
# (moudimash99), never in a repo or anywhere public. The driver logins and the k3s snapshot + token go only to
# /srv/backups/server-only/<day> on the server (not exported, not copied to the Acer): NFS trusts the uid a client
# claims, and every pod on the Acer can reach the export. A copy of those off the server needs encryption first.
# Free Motion's records (the never-apply-twice ledger, the tracker and the other record files in fm-data's data/ and
# config/, ~5 MB packed) are copied every night since this change (architecture review 2026-11-27, recommendation 1).
# Before it they left the server's disk only in fm-data's git snapshots, which are made by hand. backup-acer
# checks that night's copy on the Acer's own disk and writes a stamp node-exporter reads (alert
# FreeMotionRecordsNotCopied). Never copied: fm-data's .env (not even mounted), the site logins, the posting texts,
# output/, the screenshots and the browser profiles.
# Left out on purpose (big, or easy to make again): Frigate recordings, bg-taste-match audio and caches, Prometheus,
# the registry, the session histories under /srv/apps/freemotion/home, the rest of fm-data (git snapshots by hand; the
# big files the scan and the scoring make again, see FM_LEAVE) and all code (GitHub).
# Restore: copy the file back while the app is stopped (scale it to 0), then start it. A test restore of cat-weight's
# DB was run on 2026-11-23 (see services.yaml, backups). Free Motion's records: stop the burn and wait for "FM: DONE"
# first, then untar the night's freemotion-records.tar.gz into /srv/apps/freemotion/fm-data (paths start at data/ and
# config/); freemotion-records.json next to it lists each file's size and sha256.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: apps
data:
  backup.py: |
    import datetime, fnmatch, hashlib, io, json, os, shutil, sqlite3, sys, tarfile, time, traceback
    MODE = sys.argv[1]                       # server | acer
    DAY = datetime.datetime.now().strftime("%Y-%m-%d")
    KEEP = 7
    errors, done = [], []

    def secure(path):
        for root, dirs, files in os.walk(path):
            for d in dirs: os.chmod(os.path.join(root, d), 0o700)
            for f in files: os.chmod(os.path.join(root, f), 0o600)
        os.chmod(path, 0o700)
        if os.geteuid() == 0:
            for root, dirs, files in os.walk(path):
                for n in dirs + files: os.lchown(os.path.join(root, n), 1000, 1000)
            os.lchown(path, 1000, 1000)

    def sqlite_copy(src, dst):
        os.makedirs(os.path.dirname(dst), exist_ok=True)
        if os.path.exists(dst): os.remove(dst)
        s = sqlite3.connect(f"file:{src}?mode=ro", uri=True, timeout=60)
        d = sqlite3.connect(dst)
        with d: s.backup(d)
        ok = d.execute("pragma quick_check").fetchone()[0]
        s.close(); d.close()
        if ok != "ok": raise RuntimeError(f"quick_check: {ok}")

    def tar_copy(dst, items, exclude=()):
        os.makedirs(os.path.dirname(dst), exist_ok=True)
        def skip(t):
            return None if any(x in t.name for x in exclude) else t
        with tarfile.open(dst, "w:gz") as t:
            for src, arc in items:
                if os.path.exists(src): t.add(src, arcname=arc, filter=skip)

    def file_copy(src, dst):
        os.makedirs(os.path.dirname(dst), exist_ok=True)
        shutil.copy2(src, dst)

    def step(name, fn, *a, **k):
        try:
            fn(*a, **k); done.append(name); print("ok   ", name, flush=True)
        except Exception as e:
            errors.append(name); print("FAIL ", name, "-", e, flush=True); traceback.print_exc()

    def prune(folder):
        if not os.path.isdir(folder): return
        os.chmod(folder, 0o700)
        if os.geteuid() == 0: os.lchown(folder, 1000, 1000)
        days = sorted(d for d in os.listdir(folder) if len(d) == 10 and d[4] == "-")
        for d in days[:-KEEP]:
            shutil.rmtree(os.path.join(folder, d), ignore_errors=True); print("pruned", folder, d)

    # Free Motion's records (fm-data, written all day by the rounds). Only fm-data's data/ and config/ are mounted, so
    # its .env never is, and only the files directly in data/, in data/lessons-weekly and in config/ are read: the site
    # logins, posting texts, screenshots and caches are in other sub-folders. Left out by name: old hand-made copies,
    # the machine file, and the big files the scan and the scoring make again (scores, scan history, pipeline, the
    # live-check cache: ~15 MB a night more; adding them is the user's call).
    FM = "/src/fm-data"
    FM_FOLDERS = (("data", (".tsv", ".jsonl", ".json", ".md")), ("data/lessons-weekly", (".md",)),
                  ("config", (".yml", ".json", ".md", ".txt")))
    FM_LEAVE = ("*.bak*", "*.backup*", "*mojibake*", "llm-*.tsv", "scan-history*", "pipeline*", "posting-liveness*",
                "playwright-mcp-*")
    FM_SECRET = ("credential", "cookie", "token", "secret", "password", "auth", ".env")   # never copied, even if new
    LEDGER, TRACKER = "data/freemotion-submissions.tsv", "data/applications.md"
    STAMPS = "/textfile"   # the machine's /var/lib/node-exporter/textfile, read by node-exporter

    def backup_stamp(item, place, taken):
        # When the newest good copy of an item in this place was taken. alert-rules.yml reads it through node-exporter.
        tmp = f"{STAMPS}/.backup-{item}-{place}.tmp"   # node-exporter reads only *.prom
        with open(tmp, "w", newline="\n") as f:
            f.write("# HELP homelab_backup_newest_copy_timestamp_seconds When the newest good copy of a backup item"
                    " in this place was taken (k8s/apps/backups).\n"
                    "# TYPE homelab_backup_newest_copy_timestamp_seconds gauge\n"
                    f'homelab_backup_newest_copy_timestamp_seconds{{item="{item}",place="{place}"}} {taken:.0f}\n')
        os.chmod(tmp, 0o644)   # node-exporter runs as uid 65534
        os.replace(tmp, f"{STAMPS}/backup-{item}-{place}.prom")

    def steady_read(path):
        # The rounds write while this reads: the ledger is appended to, the tracker and the JSON files are swapped in
        # by a rename. Read again until the file stayed the same during the read (and a JSON file parses).
        for _ in range(5):
            before = os.stat(path)
            with open(path, "rb") as f: data = f.read()
            after = os.stat(path)
            same = (before.st_ino, before.st_mtime_ns) == (after.st_ino, after.st_mtime_ns) and len(data) == after.st_size
            if same and path.endswith(".json"):
                try: json.loads(data)
                except ValueError: same = False
            if same: return data, after, True
            time.sleep(1)
        return data, after, False

    def fm_records(out, earlier):
        # earlier: the earlier night folders, oldest first, for the ledger check.
        taken = time.time()
        files, changing, skipped = {}, [], []
        for folder, types in FM_FOLDERS:
            if not os.path.isdir(f"{FM}/{folder}"): continue   # a missing ledger or tracker is caught below
            for n in sorted(os.listdir(f"{FM}/{folder}")):
                rel, p = f"{folder}/{n}", f"{FM}/{folder}/{n}"
                if os.path.islink(p) or not os.path.isfile(p) or not n.endswith(types): continue
                if any(fnmatch.fnmatch(n, x) for x in FM_LEAVE): continue
                if any(w in n.lower() for w in FM_SECRET):
                    skipped.append(rel); print("skip  ", rel, "(its name looks like a secret)", flush=True); continue
                data, st, steady = steady_read(p)
                if not steady: changing.append(rel)
                files[rel] = (data, st)
        problems = [f"{m} is missing or empty" for m in (LEDGER, TRACKER) if not files.get(m, (b"",))[0]]
        # The ledger only grows (append-only, fm-core lib/freemotion-submissions.mjs). Shorter than in the last good
        # night means something cut it: alert, and keep that night's copy before it is pruned. Flagged nights are not
        # compared with, so this fails every night until the ledger is whole again.
        prev = None
        for d in reversed(earlier):
            if os.path.exists(f"{d}/freemotion-records.json"):
                with open(f"{d}/freemotion-records.json") as f: m = json.load(f)
                if not m["problems"]: prev = m; break
        if prev and LEDGER in files and LEDGER in prev["files"] and len(files[LEDGER][0]) < prev["files"][LEDGER]["bytes"]:
            problems.append(f"the ledger is shorter than in the {prev['day']} copy ({len(files[LEDGER][0])} <"
                            f" {prev['files'][LEDGER]['bytes']} bytes): keep that night's copy before it is pruned")
        dst = f"{out}/freemotion-records.tar.gz"
        with tarfile.open(dst + ".part", "w:gz", compresslevel=6) as t:
            for rel, (data, st) in files.items():
                ti = tarfile.TarInfo(rel); ti.size = len(data); ti.mtime = st.st_mtime; ti.mode = st.st_mode & 0o777
                ti.uid, ti.gid = st.st_uid, st.st_gid   # moudimash99: a restore with sudo tar must not leave root's files
                t.addfile(ti, io.BytesIO(data))
        os.replace(dst + ".part", dst)
        man = {"taken": taken, "day": DAY, "problems": problems, "still_changing": changing, "skipped": skipped,
               "ledger_rows": files[LEDGER][0].count(b"\n") if LEDGER in files else 0,
               "files": {rel: {"bytes": len(d), "sha256": hashlib.sha256(d).hexdigest()} for rel, (d, st) in files.items()}}
        with open(f"{out}/freemotion-records.json", "w") as f: json.dump(man, f, indent=1)
        print(f"      {len(files)} files, {sum(len(d) for d, _ in files.values()) / 1e6:.1f} MB read,"
              f" {os.path.getsize(dst) / 1e6:.1f} MB packed, {man['ledger_rows']} ledger rows"
              + (f"; still changing after 5 reads (kept as read): {changing}" if changing else ""), flush=True)
        if problems: raise RuntimeError("; ".join(problems))
        backup_stamp("freemotion-records", "server", taken)

    def fm_check_copy(night):
        # The server's night, now on the Acer's own disk: check its Free Motion records against their manifest, then
        # stamp the time they were read on the server, not now (an old night copied again must not look fresh).
        with open(f"{night}/freemotion-records.json") as f: man = json.load(f)
        if man["problems"]: raise RuntimeError("the server's copy reported: " + "; ".join(man["problems"]))
        seen = {}
        with tarfile.open(f"{night}/freemotion-records.tar.gz") as t:
            for m in t:
                if m.isfile(): seen[m.name] = hashlib.sha256(t.extractfile(m).read()).hexdigest()
        bad = sorted(n for n, v in man["files"].items() if seen.get(n) != v["sha256"])
        if bad or LEDGER not in seen or len(seen) != len(man["files"]):
            raise RuntimeError(f"the copy differs from its manifest ({len(bad)} files, e.g. {bad[:3]})")
        backup_stamp("freemotion-records", "acer", man["taken"])

    if MODE == "server":
        out = f"/backup/server/{DAY}"; os.makedirs(out, exist_ok=True)
        # The driver logins and the k3s snapshot + token (which together open every Secret) stay on the server, out of
        # the NFS export: NFS trusts the uid a client claims, and every pod on the Acer reaches the server's port 2049.
        priv = f"/private/{DAY}"; os.makedirs(priv, exist_ok=True)
        step("freemotion-hub hub.db", sqlite_copy, "/src/freemotion-hub/hub.db", f"{out}/freemotion-hub/hub.db")
        earlier = [f"/backup/server/{d}" for d in sorted(os.listdir("/backup/server")) if len(d) == 10 and d < DAY]
        step("freemotion records (ledger, tracker, ...)", fm_records, out, earlier)
        home = "/src/fm-home"
        logins = [(f"{home}/{a}/{f}", f"{a}/{f}") for a in (".claude-account1", ".claude-account2", ".claude-account3")
                  for f in (".credentials.json", ".claude.json", "settings.json")]
        logins += [(f"{home}/.codex/auth.json", ".codex/auth.json"), (f"{home}/.codex/config.toml", ".codex/config.toml"),
                   (f"{home}/.copilot", ".copilot"), (f"{home}/.gemini", ".gemini"), (f"{home}/.config/gh", ".config/gh"),
                   (f"{home}/.gitconfig", ".gitconfig"), (f"{home}/.fm-llm", ".fm-llm")]
        step("freemotion driver logins (server only)", tar_copy, f"{priv}/freemotion-home-logins.tar.gz", logins, exclude=("/cache", "/logs", "/tmp"))
        step("personal-website tracking-data", tar_copy, f"{out}/personal-website-tracking-data.tar.gz", [("/src/tracking-data", "tracking-data")])
        st = "/src/k3s-storage"
        for pvc in sorted(os.listdir(st)):
            if pvc.endswith("_tools_uptime-kuma-data"):
                step("uptime-kuma kuma.db", sqlite_copy, f"{st}/{pvc}/kuma.db", f"{out}/uptime-kuma/kuma.db")
            elif pvc.endswith("_monitoring_grafana-data"):
                step("grafana grafana.db", sqlite_copy, f"{st}/{pvc}/grafana.db", f"{out}/grafana/grafana.db")
            elif pvc.endswith("_tools_beszel-data"):
                for db in ("data.db", "auxiliary.db"):
                    if os.path.exists(f"{st}/{pvc}/{db}"):
                        step(f"beszel {db}", sqlite_copy, f"{st}/{pvc}/{db}", f"{out}/beszel/{db}")
            elif pvc.endswith("_tools_portainer-data"):
                # BoltDB, copied as a file while Portainer runs: may need Portainer's own restore if it is mid-write.
                step("portainer portainer.db", file_copy, f"{st}/{pvc}/portainer.db", f"{out}/portainer/portainer.db")
        # The newest by time: names differ (etcd-snapshot-<node>-<ts>, pre-move-116-...), so not by name.
        snaps = sorted(os.listdir("/src/k3s-snapshots"), key=lambda n: os.path.getmtime(f"/src/k3s-snapshots/{n}"))
        if snaps:
            step("k3s latest etcd snapshot (server only)", file_copy, f"/src/k3s-snapshots/{snaps[-1]}", f"{priv}/k3s/{snaps[-1]}")
        step("k3s server token (server only)", file_copy, "/src/k3s-token", f"{priv}/k3s/token")
        secure(out); prune("/backup/server")
        secure(priv); prune("/private")

    elif MODE == "acer":
        out = f"/backup/acer/{DAY}"; os.makedirs(out, exist_ok=True)
        a = "/src/apps"
        step("cat-weight", sqlite_copy, f"{a}/cat-weight/cat_data.db", f"{out}/cat-weight/cat_data.db")
        step("boardxplorer", sqlite_copy, f"{a}/boardxplorer/db.sqlite3", f"{out}/boardxplorer/db.sqlite3")
        step("unmatched", tar_copy, f"{out}/unmatched.tar.gz", [(f"{a}/unmatched", "unmatched")])
        step("boardgamefinder Games.db", sqlite_copy, f"{a}/boardgamefinder/data/Games.db", f"{out}/boardgamefinder/Games.db")
        step("bg-taste-match bgtaste.db", sqlite_copy, f"{a}/bg-taste-match/bgtaste.db", f"{out}/bg-taste-match/bgtaste.db")
        caps_started = datetime.datetime.now().timestamp()
        step("bg-taste-match captions + speakers", tar_copy, f"{out}/bg-taste-match-captions.tar.gz",
             [(f"{a}/bg-taste-match/captions", "captions"), (f"{a}/bg-taste-match/diar", "diar")])
        # Taste Match deletes a video's audio only once its captions and speakers are older than this stamp, so they
        # are in a backup (bg-taste-match audio_prune.py, bg-taste-match#8). Written only when the copy succeeded.
        if "bg-taste-match captions + speakers" in done:
            def stamp():
                with open(f"{a}/bg-taste-match/backup-stamp.json", "w") as f:
                    json.dump({"started": caps_started, "day": DAY, "copy": f"{out}/bg-taste-match-captions.tar.gz"}, f)
            step("bg-taste-match backup stamp", stamp)
        if os.path.exists(f"{a}/lab/lab.db"):
            step("lab lab.db", sqlite_copy, f"{a}/lab/lab.db", f"{out}/lab/lab.db")
        step("email-remove (private)", tar_copy, f"{out}/email-remove.tar.gz", [(f"{a}/email-remove", "email-remove")],
             exclude=("__pycache__",))
        step("frigate config", tar_copy, f"{out}/frigate-config.tar.gz", [(f"{a}/frigate/config/config.yml", "config/config.yml")])
        for db in ("frigate.db",):
            if os.path.exists(f"{a}/frigate/config/{db}"):
                step(f"frigate {db}", sqlite_copy, f"{a}/frigate/config/{db}", f"{out}/frigate/{db}")
        step("cat-monitor reports", tar_copy, f"{out}/cat-monitor.tar.gz", [(f"{a}/cat-monitor", "cat-monitor")],
             exclude=("/code", "__pycache__", ".pt", ".onnx"))
        secure(out); prune("/backup/acer")
        # The server's latest night, onto the Acer's own disk.
        nights = sorted(d for d in os.listdir("/backup/server") if len(d) == 10) if os.path.isdir("/backup/server") else []
        if nights:
            dst = f"/local/server/{nights[-1]}"
            def pull():
                if os.path.exists(dst): shutil.rmtree(dst)
                shutil.copytree(f"/backup/server/{nights[-1]}", dst); secure(dst)
            step(f"server night {nights[-1]} copied to the Acer", pull)
            if f"server night {nights[-1]} copied to the Acer" in done:
                step("freemotion records checked on the Acer", fm_check_copy, dst)
            prune("/local/server")
        else:
            errors.append("no server night to copy"); print("FAIL  no server night to copy")

    print(json.dumps({"mode": MODE, "day": DAY, "ok": done, "failed": errors}))
    sys.exit(1 if errors else 0)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-server
  namespace: apps
  labels: { app: backups }
spec:
  schedule: "40 2 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app: backups, side: server }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: moudimash99 }
          priorityClassName: batch-low
          containers:
            - name: backup
              image: docker.io/library/python:3.13-slim
              command: ["python", "/script/backup.py", "server"]
              securityContext: { runAsUser: 0 }   # reads root-owned k3s files; writes owned by uid 1000
              volumeMounts:
                - { name: script, mountPath: /script }
                - { name: out, mountPath: /backup }
                - { name: private, mountPath: /private }
                - { name: hub, mountPath: /src/freemotion-hub }
                - { name: fm-records, mountPath: /src/fm-data/data, readOnly: true }
                - { name: fm-settings, mountPath: /src/fm-data/config, readOnly: true }
                - { name: stamps, mountPath: /textfile }
                - { name: fm-home, mountPath: /src/fm-home, readOnly: true }
                - { name: tracking, mountPath: /src/tracking-data, readOnly: true }
                - { name: storage, mountPath: /src/k3s-storage }
                - { name: snapshots, mountPath: /src/k3s-snapshots, readOnly: true }
                - { name: token, mountPath: /src/k3s-token, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - { name: script, configMap: { name: backup-script } }
            - { name: out, hostPath: { path: /srv/backups/nightly, type: DirectoryOrCreate } }
            # Not exported: the logins and the k3s snapshot + token (see the script).
            - { name: private, hostPath: { path: /srv/backups/server-only, type: DirectoryOrCreate } }
            # SQLite folders are mounted read-write only so SQLite can use the -shm file: the script only reads them.
            - { name: hub, hostPath: { path: /srv/apps/freemotion-hub, type: Directory } }
            # fm-data's data/ and config/ only, read-only: its .env (at the top of fm-data) is never in this pod.
            - { name: fm-records, hostPath: { path: /srv/apps/freemotion/fm-data/data, type: Directory } }
            - { name: fm-settings, hostPath: { path: /srv/apps/freemotion/fm-data/config, type: Directory } }
            # node-exporter's textfile folder (k8s/monitoring/node-exporter.yaml): the backups' stamps.
            - { name: stamps, hostPath: { path: /var/lib/node-exporter/textfile, type: DirectoryOrCreate } }
            - { name: fm-home, hostPath: { path: /srv/apps/freemotion/home, type: Directory } }
            - { name: tracking, hostPath: { path: /home/moudimash99/Personal-Website/tracking-data, type: Directory } }
            - { name: storage, hostPath: { path: /var/lib/rancher/k3s/storage, type: Directory } }
            - { name: snapshots, hostPath: { path: /var/lib/rancher/k3s/server/db/snapshots, type: Directory } }
            - { name: token, hostPath: { path: /var/lib/rancher/k3s/server/token, type: File } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-acer
  namespace: apps
  labels: { app: backups }
spec:
  schedule: "20 3 * * *"   # the mail classifier sleeps 23:00-07:00, so the Acer has room
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { app: backups, side: acer }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-low
          containers:
            - name: backup
              image: docker.io/library/python:3.13-slim
              command: ["python", "/script/backup.py", "acer"]
              securityContext: { runAsUser: 0 }   # the apps' folders are owned by root or uid 1000
              volumeMounts:
                - { name: script, mountPath: /script }
                - { name: out, mountPath: /backup }
                - { name: local, mountPath: /local }
                - { name: apps, mountPath: /src/apps }
                - { name: stamps, mountPath: /textfile }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
          volumes:
            - { name: script, configMap: { name: backup-script } }
            # The server's /srv/backups/nightly (exported to the Acer only; all writes become uid 1000).
            - { name: out, nfs: { server: 192.168.1.116, path: /srv/backups/nightly } }
            - { name: local, hostPath: { path: /var/backups/nightly, type: DirectoryOrCreate } }
            # Read-write only so SQLite can use the -shm file: the script only reads them.
            - { name: apps, hostPath: { path: /srv/apps, type: Directory } }
            # node-exporter's textfile folder (k8s/monitoring/node-exporter.yaml): the backups' stamps.
            - { name: stamps, hostPath: { path: /var/lib/node-exporter/textfile, type: DirectoryOrCreate } }
