# Uptime Kuma, Beszel and Portainer keep 192.168.1.135 in their own databases. This forwards those
# ports to the server's real address, so they work even with .135 on no connection at all.
# Delete this file (and the objects) once they all use 192.168.1.116, or when .135 is back on Ethernet.
# externalIPs is deprecated in Kubernetes 1.36: check this still works after a k3s upgrade.
apiVersion: v1
kind: Service
metadata:
  name: old-address
  namespace: tools
spec:
  externalIPs: [192.168.1.135]
  ports:
    - { name: frigate, port: 5000, targetPort: 5000 }
    - { name: portainer-agent, port: 9001, targetPort: 9001 }
    - { name: beszel-agent, port: 45876, targetPort: 45876 }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: old-address-1
  namespace: tools
  labels: { kubernetes.io/service-name: old-address }
addressType: IPv4
ports:
  - { name: frigate, port: 5000, protocol: TCP }
  - { name: portainer-agent, port: 9001, protocol: TCP }
  - { name: beszel-agent, port: 45876, protocol: TCP }
endpoints:
  - addresses: [192.168.1.116]
