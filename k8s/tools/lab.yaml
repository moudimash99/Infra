# lab.machaka.net: the homelab's own status site (code in lab/, design in lab/DESIGN.md). Behind Cloudflare Access.
# For each job it shows what the job is for: bg-taste-match's pipeline, today's board game deals, the cats (frames and
# clips from Frigate), the GPU, the PC's jobs; and "Needs you" from Alertmanager on the front page.
# It runs on the Acer because it reads the jobs' folders there (read-only). Its own memory (job runs, log summaries,
# daily progress, clip cache) is /srv/apps/lab.
# The PC posts its jobs' status to port 8081 (NodePort 30881, home network only, never in the Ingress), with the token
# in Secret lab-intake (key token); the PC keeps the same token in %USERPROFILE%\.lab-token.
# Homepage (homepage.yaml) still runs; to go back, point the Ingress below at service homepage.
# Build: sh lab/build.sh TAG, then set the image tag below and apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab
  namespace: tools
---
# Read only: the nodes (machine state).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lab }
subjects:
  - { kind: ServiceAccount, name: lab, namespace: tools }
---
# Read only, apps only: the pods (who uses the GPU), the jobs, their schedules and their logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab
  namespace: apps
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab
  namespace: apps
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: lab }
subjects:
  - { kind: ServiceAccount, name: lab, namespace: tools }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab
  namespace: tools
  labels: { app: lab }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: lab }
  template:
    metadata:
      labels: { app: lab }
    spec:
      serviceAccountName: lab
      nodeSelector: { kubernetes.io/hostname: acer-laptop }
      tolerations:
        - { key: dedicated, value: worker, effect: NoSchedule }
      securityContext: { runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true }
      containers:
        - name: lab
          image: docker.io/library/lab:2026-11-10c
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
            - { name: intake, containerPort: 8081 }
          env:
            - { name: LAB_DB, value: /srv/lab/lab.db }
            - name: INTAKE_TOKEN
              # Without the Secret the intake refuses every report (401); the pages work either way.
              valueFrom: { secretKeyRef: { name: lab-intake, key: token, optional: true } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: lab, mountPath: /srv/lab }
            - { name: tmp, mountPath: /tmp }
            - { name: bgt, mountPath: /data/bg-taste-match, readOnly: true }
            - { name: bgt-audio, mountPath: /data/bg-taste-match-audio, readOnly: true }
            - { name: bgf, mountPath: /data/boardgamefinder, readOnly: true }
            - { name: cats, mountPath: /data/cat-monitor, readOnly: true }
            - { name: cat-weight, mountPath: /data/cat-weight, readOnly: true }
      volumes:
        - name: lab
          hostPath: { path: /srv/apps/lab, type: Directory }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: bgt
          hostPath: { path: /srv/apps/bg-taste-match, type: Directory }
        - name: bgt-audio
          hostPath: { path: /var/lib/bg-taste-match/audio, type: Directory }
        - name: bgf
          hostPath: { path: /srv/apps/boardgamefinder/data, type: Directory }
        - name: cats
          hostPath: { path: /srv/apps/cat-monitor, type: Directory }
        - name: cat-weight
          hostPath: { path: /srv/apps/cat-weight, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: lab
  namespace: tools
spec:
  selector: { app: lab }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The PC's reports: home network only (NodePort on the Acer), token required.
apiVersion: v1
kind: Service
metadata:
  name: lab-intake
  namespace: tools
spec:
  type: NodePort
  selector: { app: lab }
  ports:
    - { name: intake, port: 8081, targetPort: intake, nodePort: 30881 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  namespace: tools
spec:
  ingressClassName: traefik
  rules:
    - host: lab.machaka.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: lab, port: { name: http } }
