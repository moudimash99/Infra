# lab.machaka.net: one page with every site and tool, each with its live numbers (Homepage).
# Its Portainer API key is in the Secret homepage-env (HOMEPAGE_VAR_PORTAINER_KEY). The Uptime Kuma widget
# reads Kuma's status page "homelab". Beszel's and Grafana's widgets would need admin logins (a Beszel
# superuser, a Grafana server admin), so those two tiles only check that the tool answers.
# The tiles and their layout (services.yaml, settings.yaml) come from ConfigMap homepage-menu, which
# scripts/menu.py makes from Infra/services.yaml (k8s/tools/homepage-menu.yaml): edit services.yaml, not that file.
# A changed ConfigMap does not restart the pod: kubectl -n tools rollout restart deploy/homepage.
# Behind Cloudflare Access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: tools
---
# Read-only: the cluster widget (nodes, CPU, memory) and each app's pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: tools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: tools
data:
  kubernetes.yaml: |
    mode: cluster
  widgets.yaml: |
    - kubernetes:
        cluster: { show: true, cpu: true, memory: true, showLabel: true, label: cluster }
        nodes: { show: true, cpu: true, memory: true, showLabel: true }
    - datetime:
        text_size: md
        format: { dateStyle: long, timeStyle: short, hour12: false }
  bookmarks.yaml: |
    - Admin:
        - Infra repo:
            - icon: github.png
              href: https://github.com/moudimash99/Infra
        - Cloudflare:
            - icon: cloudflare.png
              href: https://dash.cloudflare.com
        - Cloudflare Zero Trust:
            - icon: cloudflare-zero-trust.png
              href: https://one.dash.cloudflare.com
  docker.yaml: ""
  proxmox.yaml: ""
  custom.css: ""
  custom.js: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: tools
  labels: { app: homepage }
spec:
  replicas: 1
  selector:
    matchLabels: { app: homepage }
  template:
    metadata:
      labels: { app: homepage }
    spec:
      serviceAccountName: homepage
      priorityClassName: homelab-critical
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.5.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: MY_POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            # The names it answers to: the public one, the probe's, and a port-forward's.
            - { name: HOMEPAGE_ALLOWED_HOSTS, value: "lab.machaka.net,$(MY_POD_IP):3000,localhost:3000" }
          envFrom:
            - secretRef: { name: homepage-env }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/healthcheck, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthcheck, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
            - { name: menu, mountPath: /app/config/settings.yaml, subPath: settings.yaml }
            - { name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml }
            - { name: menu, mountPath: /app/config/services.yaml, subPath: services.yaml }
            - { name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
            - { name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml }
            - { name: config, mountPath: /app/config/proxmox.yaml, subPath: proxmox.yaml }
            - { name: config, mountPath: /app/config/custom.css, subPath: custom.css }
            - { name: config, mountPath: /app/config/custom.js, subPath: custom.js }
            - { name: logs, mountPath: /app/config/logs }
      volumes:
        - name: config
          configMap: { name: homepage }
        - name: menu
          configMap: { name: homepage-menu }
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: tools
spec:
  selector: { app: homepage }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: tools
spec:
  ingressClassName: traefik
  rules:
    - host: lab.machaka.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: homepage, port: { name: http } }
