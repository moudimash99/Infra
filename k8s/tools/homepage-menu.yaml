# MADE BY scripts/menu.py from services.yaml: do not edit by hand. Change services.yaml (an entry's
# menu: block) or the script, run it, then apply this file and restart Homepage:
#   kubectl apply -f k8s/tools/homepage-menu.yaml && kubectl -n tools rollout restart deploy/homepage
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-menu
  namespace: tools
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    hideVersion: true
    layout:
      Board games:
        style: row
        columns: 3
      Cats:
        style: row
        columns: 3
      Job search:
        style: row
        columns: 4
      Gmail:
        style: row
        columns: 3
      Website and lab:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 4
      Platform:
        style: row
        columns: 3
  services.yaml: |
    - Board games:
      - BoardXplorer:
          href: https://boardxplorer.machaka.net
          description: BoardGameGeek collection explorer
          icon: mdi-dice-multiple
          namespace: apps
          app: boardxplorer
          podSelector: app=boardxplorer
          siteMonitor: http://boardxplorer.apps.svc
      - Unmatched:
          href: https://unmatched.machaka.net
          description: Fighter matcher, guides and tournaments
          icon: mdi-sword-cross
          namespace: apps
          app: unmatched
          podSelector: app=unmatched
          siteMonitor: http://unmatched.apps.svc
          widget:
            type: prometheusmetric
            url: http://prometheus.monitoring.svc
            refreshInterval: 60000
            metrics:
            - label: Since the last good run
              query: time() - kube_cronjob_status_last_successful_time{namespace="apps",cronjob="unmatched-restart"}
              format:
                type: duration
      - Spirit Island:
          href: https://spirit.machaka.net
          description: Planner for 1 to 6 players
          icon: mdi-palm-tree
          namespace: apps
          app: spirit-island
          podSelector: app=spirit-island
          siteMonitor: http://spirit-island.apps.svc/healthz
      - Deals:
          href: https://deals.machaka.net
          description: Okkazeo, checked every morning
          icon: mdi-tag-heart
          widget:
            type: customapi
            url: http://lab.tools.svc/api/summary/deals
            refreshInterval: 300000
            display: list
            mappings:
            - field: run
              label: Last run
            - field: best
              label: Best now
            - field: new
              label: New and cheap
            - field: bundles
              label: Bundles to judge
      - Taste Match:
          href: https://tastematch.machaka.net
          description: Reviews from YouTube to each host's scores
          icon: mdi-youtube
          widget:
            type: customapi
            url: http://lab.tools.svc/api/summary/tastematch
            refreshInterval: 60000
            display: list
            mappings:
            - field: download
              label: Downloaded
            - field: transcribe
              label: Transcribed
            - field: speakers
              label: Speakers
            - field: rate
              label: Rated
    - Cats:
      - Cat weight:
          href: https://cat.machaka.net
          description: 'cat.machaka.net: weigh-ins per cat'
          icon: mdi-scale-bathroom
          namespace: apps
          app: cat-weight
          podSelector: app=cat-weight
          siteMonitor: http://cat-weight.apps.svc
      - Frigate:
          href: http://192.168.1.93:5000
          description: Living-room camera (home network only)
          icon: frigate.png
          namespace: apps
          app: frigate
          podSelector: app=frigate
          widget:
            type: frigate
            url: http://192.168.1.93:5000
      - Cat cam:
          href: https://catcam.machaka.net
          description: Flash of the day, camera, weights
          icon: mdi-cat
          widget:
            type: customapi
            url: http://lab.tools.svc/api/summary/catcam
            refreshInterval: 300000
            display: list
            mappings:
            - field: flash
              label: Flash
            - field: weighed
              label: Last weigh-in
    - Job search:
      - Free Motion:
          href: https://freemotion.machaka.net
          description: Job applications dashboard
          icon: mdi-briefcase-search
          namespace: apps
          app: freemotion-hub
          podSelector: app=freemotion-hub
      - LLM gateway:
          description: The one way the home's projects call a model
          icon: mdi-brain
          namespace: apps
          app: llm-gateway
          podSelector: app=llm-gateway
          siteMonitor: http://llm-gateway.apps.svc:8792/healthz
      - Free Motion jobs:
          description: Controller, one browser per lane, website writer
          icon: mdi-robot-outline
          namespace: apps
          app: free-motion
          podSelector: app in (fm-controller,fm-browser)
      - Upwork scan:
          description: Four times a day on the PC
          icon: mdi-briefcase-search-outline
    - Gmail:
      - Mail classifier:
          description: Decides for the archiver; asleep at night when idle
          icon: mdi-email-search
          namespace: apps
          app: mail-classifier
          podSelector: app=mail-classifier-waker
      - Gmail archiver:
          description: Archives job rejections and notices every 3 minutes
          icon: mdi-email-remove
          widget:
            type: prometheusmetric
            url: http://prometheus.monitoring.svc
            refreshInterval: 60000
            metrics:
            - label: Since the last good run
              query: time() - kube_cronjob_status_last_successful_time{namespace="apps",cronjob="email-remove"}
              format:
                type: duration
      - Daily review:
          description: Review of the archiver's decisions, 17:00 on the PC
          icon: mdi-email-check
      - Mail review now:
          href: https://lab.machaka.net/mail-review/
          description: What is still open in 30 days of mail, by email
          icon: mdi-email-search
          namespace: apps
          app: gmail-open-review
          podSelector: app=mail-review-button
    - Website and lab:
      - Website:
          href: https://machaka.net
          description: machaka.net
          icon: mdi-web
          namespace: apps
          app: website
          podSelector: app=website
          siteMonitor: http://website.apps.svc
      - Lab sites:
          description: Taste Match, Deals and Cat cam, one process
          icon: mdi-flask-outline
          namespace: tools
          app: lab-sites
          podSelector: app=lab
      - Homelab overview:
          href: https://lab.machaka.net/machines/
          icon: mdi-monitor-dashboard
          description: Is everything all right, and why; filter by machine and project
    - Monitoring:
      - Beszel:
          href: https://beszel.machaka.net
          description: Machines and Docker containers, with history and alerts
          icon: beszel.png
          namespace: tools
          app: beszel
          podSelector: app=beszel
          siteMonitor: http://beszel.tools.svc/api/health
      - Uptime Kuma:
          href: https://status.machaka.net
          description: Checks every site each minute, emails when one is down
          icon: uptime-kuma.png
          namespace: tools
          app: uptime-kuma
          podSelector: app=uptime-kuma
          widget:
            type: uptimekuma
            url: http://uptime-kuma.tools.svc
            slug: homelab
      - Prometheus:
          description: 'No public address: kubectl -n monitoring port-forward svc/prometheus 9090:80'
          icon: prometheus.png
          namespace: monitoring
          app: prometheus
          podSelector: app=prometheus
          widget:
            type: prometheus
            url: http://prometheus.monitoring.svc
      - Grafana:
          href: https://grafana.machaka.net/d/home-overview
          description: Dashboards over Prometheus
          icon: grafana.png
          namespace: monitoring
          app: grafana
          podSelector: app=grafana
          siteMonitor: http://grafana.monitoring.svc/api/health
      - Scheduled jobs:
          href: https://grafana.machaka.net/d/jobs
          icon: mdi-calendar-check
          description: Every job's runs, times and memory (Grafana)
      - Who gets in:
          href: https://grafana.machaka.net/d/scheduling
          icon: mdi-account-clock
          description: Who runs, waits for room or was pushed out (Grafana)
      - Ranks and memory:
          href: https://grafana.machaka.net/d/ranks
          icon: mdi-podium
          description: Every app's rank, booking and real memory over 24 h (Grafana)
      - Temperatures:
          href: https://grafana.machaka.net/d/node-temperatures
          icon: mdi-thermometer
          description: Hottest CPU core on each machine
          widget:
            type: prometheusmetric
            url: http://prometheus.monitoring.svc
            refreshInterval: 30000
            metrics:
            - label: Server
              query: max(node_hwmon_temp_celsius{chip="platform_coretemp_0",node="moudimash99"})
              format:
                type: number
                suffix: °C
                maximumFractionDigits: 0
            - label: Acer
              query: max(node_hwmon_temp_celsius{chip="platform_coretemp_0",node="acer-laptop"})
              format:
                type: number
                suffix: °C
                maximumFractionDigits: 0
      - Alerts:
          href: https://grafana.machaka.net/d/home-overview
          description: Emailed by Alertmanager; what fires is on Grafana's home
          icon: mdi-bell-alert
          namespace: tools
          app: alertmanager
          podSelector: app=alertmanager
          widget:
            type: prometheusmetric
            url: http://prometheus.monitoring.svc
            refreshInterval: 60000
            metrics:
            - label: Firing now
              query: count(ALERTS{alertstate="firing"}) or vector(0)
              format:
                type: number
      - Machine metrics:
          description: node-exporter and process-exporter on every node
          icon: mdi-server
          namespace: monitoring
          app: node-exporters
          podSelector: app=node-exporter
      - GPU (Acer):
          href: https://grafana.machaka.net/d/usage
          description: 'GTX 1050: use, memory, heat, and who is on it'
          icon: mdi-expansion-card
          namespace: monitoring
          app: gpu-metrics
          podSelector: app=nvidia-gpu-exporter
          widget:
            type: prometheusmetric
            url: http://prometheus.monitoring.svc
            refreshInterval: 30000
            metrics:
            - label: Use
              query: max(nvidia_smi_utilization_gpu_ratio) * 100
              format:
                type: percent
            - label: Memory
              query: max(nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes) * 100
              format:
                type: percent
            - label: Heat
              query: max(nvidia_smi_temperature_gpu)
              format:
                type: number
                suffix: °C
                maximumFractionDigits: 0
      - Docker monitoring:
          description: cAdvisor for the server's Docker containers
          icon: mdi-docker
    - Platform:
      - Portainer:
          href: https://portainer.machaka.net
          description: Containers on the server (Docker) and the cluster
          icon: portainer.png
          namespace: tools
          app: portainer
          podSelector: app=portainer
          widget:
            type: portainer
            url: http://portainer.tools.svc
            env: 1
            key: '{{HOMEPAGE_VAR_PORTAINER_KEY}}'
      - Edge proxy:
          description: Cloudflare tunnel to nginx, then Traefik or Docker
          icon: cloudflare.png
      - k3s cluster:
          description: Traefik, CoreDNS, metrics-server, storage
          icon: mdi-kubernetes
          namespace: kube-system
          app: k3s-system
          podSelector: app.kubernetes.io/name=traefik
      - Registry:
          description: Image registry (the nodes don't use it yet)
          icon: mdi-package-variant-closed
          namespace: kube-system
          app: registry
          podSelector: app=registry
      - Backups:
          description: Nightly copies, each machine's onto the other
          icon: mdi-backup-restore
          widget:
            type: prometheusmetric
            url: http://prometheus.monitoring.svc
            refreshInterval: 60000
            metrics:
            - label: backup-server
              query: time() - kube_cronjob_status_last_successful_time{namespace="apps",cronjob="backup-server"}
              format:
                type: duration
            - label: backup-acer
              query: time() - kube_cronjob_status_last_successful_time{namespace="apps",cronjob="backup-acer"}
              format:
                type: duration
      - NFS:
          description: Free Motion's data and code, and the nightly backups, server to Acer
          icon: mdi-folder-network
      - Tailscale:
          description: Free Motion's agents reach the hub through it
          icon: tailscale.png
  catalog.json: |
    {
     "groups": [
      "Board games",
      "Cats",
      "Job search",
      "Gmail",
      "Website and lab",
      "Monitoring",
      "Platform"
     ],
     "services": {
      "website": {
       "group": "Website and lab",
       "title": "Website",
       "what": "Personal website (Next.js) with the CV link tracking and its admin links dashboard",
       "url": "https://machaka.net"
      },
      "cat-weight": {
       "group": "Cats",
       "title": "Cat weight",
       "what": "Cat weight tracker (Flask + SQLite)",
       "url": "https://cat.machaka.net"
      },
      "boardxplorer": {
       "group": "Board games",
       "title": "BoardXplorer",
       "what": "BoardGameGeek collection explorer (Django + SQLite)",
       "url": "https://boardxplorer.machaka.net"
      },
      "unmatched": {
       "group": "Board games",
       "title": "Unmatched",
       "what": "Unmatched fighter matcher, strategy guides and tournaments (Flask + gunicorn)",
       "url": "https://unmatched.machaka.net"
      },
      "frigate": {
       "group": "Cats",
       "title": "Frigate",
       "what": "Frigate NVR for the living-room camera (recordings, detection on the Intel GPU)",
       "url": null
      },
      "freemotion-hub": {
       "group": "Job search",
       "title": "Free Motion",
       "what": "Free Motion's dashboard server (fm-orchestrator/freemotion-hub/server.mjs with fm-web's page) and the agents' hub",
       "url": "https://freemotion.machaka.net"
      },
      "lab-sites": {
       "group": "Website and lab",
       "title": "Lab sites",
       "what": "The lab, one process serving Taste Match, Deals and Cat cam (status sites for the jobs), the homelab tool that replaces Grafana's…",
       "url": "https://tastematch.machaka.net"
      },
      "mail-classifier": {
       "group": "Gmail",
       "title": "Mail classifier",
       "what": "Trained mail classifier API for the Gmail archiver",
       "url": null
      },
      "llm-gateway": {
       "group": "Job search",
       "title": "LLM gateway",
       "what": "fm-llm's ask service, the one way the home's projects call a model (gemma, Gemini, Claude)",
       "url": null
      },
      "spirit-island": {
       "group": "Board games",
       "title": "Spirit Island",
       "what": "Spirit Island Planner: setups for 1 to 6 players (spirits that work well together, with an adversary, level and scenario matched to skill)",
       "url": "https://spirit.machaka.net"
      },
      "free-motion": {
       "group": "Job search",
       "title": "Free Motion jobs",
       "what": "Free Motion job-application automation (controller daemon, one browser per lane, the ChatGPT/Gemini website writer)",
       "url": null
      },
      "boardgamefinder": {
       "group": "Board games",
       "title": "Deals",
       "what": "Daily board game deal search (Okkazeo listings, BGG ranks, prices, deal email)",
       "url": "https://deals.machaka.net"
      },
      "bg-taste-match": {
       "group": "Board games",
       "title": "Taste Match",
