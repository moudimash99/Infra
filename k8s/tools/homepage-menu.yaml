      },
      "portainer": {
       "group": "Platform",
       "title": "Portainer",
       "what": "Web UI for the cluster and for Docker on the server",
       "url": "https://portainer.machaka.net"
      },
      "beszel": {
       "group": "Monitoring",
       "title": "Beszel",
       "what": "Light monitoring with history and alerts per machine (hub + one agent per node)",
       "url": "https://beszel.machaka.net"
      },
      "uptime-kuma": {
       "group": "Monitoring",
       "title": "Uptime Kuma",
       "what": "Checks each site every minute and emails when one is down; status page `homelab` feeds Homepage",
       "url": "https://status.machaka.net"
      },
      "homepage": {
       "group": "Website and lab",
       "title": "homepage",
       "what": "lab.machaka.net: the menu, one tile per entry in this file, grouped by system, with live numbers",
       "url": "https://lab.machaka.net"
      },
      "prometheus": {
