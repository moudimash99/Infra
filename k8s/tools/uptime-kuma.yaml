# status.machaka.net: Uptime Kuma, checks each site every minute and alerts when one is down.
# Behind Cloudflare Access, plus Kuma's own login.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: tools
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: tools
  labels: { app: uptime-kuma }
spec:
  replicas: 1
  strategy: { type: Recreate }  # SQLite: one copy at a time
  selector:
    matchLabels: { app: uptime-kuma }
  template:
    metadata:
      labels: { app: uptime-kuma }
    spec:
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2.5.7
          ports:
            - { name: http, containerPort: 3001 }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: uptime-kuma-data }
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: tools
spec:
  selector: { app: uptime-kuma }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: tools
spec:
  ingressClassName: traefik
  rules:
    - host: status.machaka.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: uptime-kuma, port: { name: http } }
