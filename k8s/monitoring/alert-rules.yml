# Prometheus alert rules. Alertmanager (k8s/tools/alertmanager.yaml) emails them: critical every 3 h while firing,
# warning every 12 h, and once more when over. One-off events (label kind: event: a failed run, a kill for memory, an
# eviction) are emailed once, with no "over" email.
# The summary is the email's subject: plain words, the machine or app first. The email turns moudimash99 into Server and
# acer-laptop into Acer, and drops pod-name hashes, so the summaries can use the raw labels.
# An event fires once: "unless max_over_time(...[6h] offset 5m)" means "not already so in the 6 hours before". Not
# "unless ... offset 1h": that looks at one instant, and a short gap in kube-state-metrics there (a restart) made old
# failures fire again (2026-11-11 21:44: three runs that had failed 18 to 43 hours before).
# kustomize puts this file next to prometheus.yml in the prometheus-config ConfigMap.
# Thresholds are for this homelab: two old laptops, one 4 GB GPU, jobs that may run for hours.
groups:
  - name: machines
    rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} doesn't answer"
          description: "node-exporter on {{ $labels.instance }} has been unreachable for 3 minutes: the machine is off, asleep or off the network."
      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: Kubernetes reports it not ready"
          description: "k3s on {{ $labels.node }} has reported NotReady for 5 minutes; its pods won't be replaced elsewhere."
      - alert: NodeMemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: memory {{ $value | humanizePercentage }} used"
          description: "Over 90% of memory in use for 10 minutes. There is no swap: the kernel will start killing processes."
      - alert: NodeMemoryCritical
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.97
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: almost out of memory ({{ $value | humanizePercentage }} used)"
          description: "Over 97% of memory in use. Expect processes to be killed."
      - alert: NodeOOMKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels: { severity: warning, kind: event }
        annotations:
          summary: "{{ $labels.instance }}: a process was killed for lack of memory"
          description: "{{ $value | humanize }} out-of-memory kill(s) in the last 15 minutes (whole machine or a container's limit). See ContainerOOMKilled for which pod."
      - alert: NodeCPUBusy
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: CPU {{ $value | humanizePercentage }} busy for 30 minutes"
          description: "Everything on this machine will be slow, Frigate's detection included."
      - alert: NodeLoadHigh
        expr: node_load15 / on (instance) count by (instance) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: overloaded ({{ $value | humanize }}x more work than CPU threads)"
          description: "More work waiting than the CPU can do, for 30 minutes (often disk or too many jobs at once)."
      - alert: NodeDiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"} / node_filesystem_size_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"
          description: "Under 10% free on {{ $labels.mountpoint }} ({{ $labels.device }})."
      - alert: NodeDiskSpaceCritical
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"} / node_filesystem_size_bytes < 0.04
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.mountpoint }} nearly full ({{ $value | humanizePercentage }} free)"
          description: "Databases and recordings on {{ $labels.mountpoint }} will start failing to write."
      - alert: NodeDiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.25
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.mountpoint }} will be full within a day"
          description: "At the last 6 hours' rate, {{ $labels.mountpoint }} fills up in under 24 hours."
      - alert: NodeFilesystemReadOnly
        expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs|fuse.*"} == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: disk {{ $labels.mountpoint }} went read-only"
          description: "Usually a disk error. Nothing can write there."
      - alert: NodeHot
        expr: max by (instance) (node_hwmon_temp_celsius) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: running hot, {{ $value | humanize }} °C"
          description: "The hottest sensor has been above 90 °C for 5 minutes. Laptops throttle, then shut down, past this."
      - alert: NodeVeryHot
        expr: max by (instance) (node_hwmon_temp_celsius) > 97
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: very hot, {{ $value | humanize }} °C"
          description: "The hottest sensor is above 97 °C: close to a thermal shutdown."

  - name: gpu
    rules:
      - alert: GPUMetricsMissing
        expr: absent(nvidia_smi_memory_total_bytes)
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Acer: no GPU readings"
          description: "nvidia-gpu-exporter isn't reporting: the exporter pod is down, or the NVIDIA driver didn't load (after a kernel update, check linux-modules-nvidia-580-<kernel>). The GPU jobs will fail too."
      - alert: GPUMemoryHigh
        expr: nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes > 0.92
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Acer: GPU memory {{ $value | humanizePercentage }} used"
          description: "The 4 GB card is nearly full; the next GPU job will fail with CUDA out of memory. Two jobs may be on it at once despite the lock."
      - alert: GPUHot
        expr: nvidia_smi_temperature_gpu > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Acer: GPU running hot, {{ $value | humanize }} °C"
          description: "The GTX 1050 has been above 85 °C for 5 minutes."
      - alert: GPUVeryHot
        expr: nvidia_smi_temperature_gpu > 92
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Acer: GPU very hot, {{ $value | humanize }} °C"
          description: "Near the card's slowdown point. Check the laptop's airflow."
      - alert: GPUBusyForDays
        expr: avg_over_time(nvidia_smi_utilization_gpu_ratio[2d]) > 0.95
        labels: { severity: warning }
        annotations:
          summary: "Acer: GPU flat out for two days"
          description: "Average GPU load above 95% for 48 hours: fine for a long Whisper backlog, but check nothing is stuck."

  - name: kubernetes
    rules:
      - alert: ContainerOOMKilled
        expr: |
          (kube_pod_container_status_terminated_reason{reason="OOMKilled"} == 1
           unless max_over_time(kube_pod_container_status_terminated_reason{reason="OOMKilled"}[6h] offset 5m) == 1)
          or
          (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
           and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total[15m]) > 0)
        labels: { severity: warning, kind: event }
        annotations:
          summary: "{{ $labels.pod }}: killed for using too much memory"
          description: "Its container {{ $labels.container }} went over its memory limit (pod {{ $labels.namespace }}/{{ $labels.pod }}). Raise the limit, or find what grew."
      - alert: PodEvicted
        # The kubelet pushed a pod out because its machine ran short (memory or disk): priority at work. An evicted
        # pod stays listed until deleted, so this fires once, right after the eviction, not for as long as it stays.
        expr: |
          (kube_pod_status_reason{reason="Evicted"} == 1
           unless max_over_time(kube_pod_status_reason{reason="Evicted"}[6h] offset 5m) == 1)
          * on (namespace, pod) group_left (node) max by (namespace, pod, node) (kube_pod_info)
        labels: { severity: warning, kind: event }
        annotations:
          summary: "{{ $labels.pod }}: pushed off {{ $labels.node }} to free memory or disk"
          description: "{{ $labels.node }} ran short of memory or disk and pushed out its lowest-priority pods first. A job retries once; a service is restarted. kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }} says why."
      - alert: ContainerMemoryNearLimit
        expr: |
          max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"})
          / on (namespace, pod, container) max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pod }}: at {{ $value | humanizePercentage }} of its memory limit"
          description: "Container {{ $labels.container }} will be killed if it grows a bit more."
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pod }}: keeps crashing ({{ $value | humanize }} restarts in 30 minutes)"
          description: "Container {{ $labels.container }} keeps crashing: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --previous"
      - alert: ContainerCannotStart
        expr: kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|ErrImageNeverPull|CreateContainerConfigError|CreateContainerError|InvalidImageName|CrashLoopBackOff|RunContainerError"} == 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pod }}: can't start ({{ $labels.reason }})"
          description: "ErrImageNeverPull means the image was never imported on that node (no registry here: docker save, then k3s ctr images import)."
      - alert: PodPendingTooLong
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 20m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pod }}: waiting over 20 minutes to start"
          description: "Usually no machine has enough unreserved memory for it; else a missing volume folder or image. kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }} says which, under Events."
      - alert: DeploymentUnavailable
        expr: kube_deployment_status_replicas_unavailable > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.deployment }}: {{ $value }} of its copies down"
          description: "For 15 minutes. The site or tool it serves is down or degraded."
      - alert: DaemonSetUnavailable
        expr: kube_daemonset_status_number_unavailable > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.daemonset }}: missing on {{ $value }} machine(s)"
          description: "A per-machine agent (monitoring, Beszel, GPU exporter) isn't running everywhere it should."
      - alert: TargetDown
        expr: up{job!="node-exporter"} == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Monitoring can't read {{ $labels.job }} ({{ $labels.instance }})"
          description: "For 10 minutes. Its graphs have a gap and its alerts can't fire."

  - name: scheduled-jobs
    rules:
      - alert: JobFailed
        # bg-taste-match's downloads fail whenever YouTube blocks the home address: BgTasteMatchDownloadsStalled covers them
        expr: |
          (kube_job_status_failed > 0 unless max_over_time(kube_job_status_failed[6h] offset 5m) > 0)
          unless on (namespace, job_name) kube_job_owner{owner_name="bg-taste-match-fetch"}
        labels: { severity: warning, kind: event }
        annotations:
          summary: "{{ $labels.job_name }}: a run failed"
          description: "It stopped with an error or ran past its time limit. Its log: kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}"
      # The "Missed" rules stay quiet while their CronJob is paused on purpose (suspend: true) and come back by
      # themselves when it is resumed: until its next good run, a resumed job still shows as missed.
      - alert: BoardGameFinderMissed
        expr: |
          time() - kube_cronjob_status_last_successful_time{cronjob="boardgamefinder"} > 26 * 3600
          unless on (namespace, cronjob) kube_cronjob_spec_suspend == 1
        labels: { severity: warning }
        annotations:
          summary: "BoardGameFinder: no finished run in over a day"
          description: "Its nightly 04:30 run failed or didn't start: no deal email today."
      - alert: BoardGameFinderFetchMissed
        expr: |
          time() - kube_cronjob_status_last_successful_time{cronjob="boardgamefinder-fetch"} > 26 * 3600
          unless on (namespace, cronjob) kube_cronjob_spec_suspend == 1
        labels: { severity: warning }
        annotations:
          summary: "BoardGameFinder's page fetcher: no full day in over a day"
          description: "Its 10:00-04:00 run stopped early (Okkazeo refused 5 pages in a row, or it was killed) or didn't start, so the nightly run had few or no fresh prices. Its log: kubectl -n apps get jobs | grep boardgamefinder-fetch, then kubectl -n apps logs job/<the last one>"
      - alert: BackupsMissed
        expr: time() - kube_cronjob_status_last_successful_time{cronjob=~"backup-server|backup-acer"} > 26 * 3600
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.cronjob }}: no good nightly backup in over a day"
          description: "The nightly copy (k8s/apps/backups) failed or didn't start. Its log names each item that failed: kubectl -n apps get jobs | grep backup, then kubectl -n apps logs job/<the last one>."
      - alert: BgTasteMatchDownloadsStalled
        expr: time() - kube_cronjob_status_last_successful_time{cronjob="bg-taste-match-fetch"} > 12 * 3600
        labels: { severity: warning }
        annotations:
          summary: "bg-taste-match: downloads haven't completed a pass in 12 hours"
          description: "Every pass for 12 hours stopped on YouTube refusing downloads (HTTP 403/429), or failed otherwise: kubectl -n apps logs job/<latest bg-taste-match-fetch job>. Blocks usually lift within a day."
      - alert: JobRunningTooLong
        expr: |
          (time() - kube_job_status_start_time) > 6 * 3600
          and on (namespace, job_name) kube_job_status_active > 0
          unless on (namespace, job_name) kube_job_owner{owner_name=~"bg-taste-match-(gpu|fetch|llm)"}
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job_name }}: still running after {{ $value | humanizeDuration }}"
          description: "Longer than any normal run (bg-taste-match's long passes are left out)."

  - name: apps
    rules:
      - alert: FrigateCameraDown
        expr: frigate_camera_fps < 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Frigate: camera {{ $labels.camera_name }} stopped ({{ $value | humanize }} fps)"
          description: "No frames for 5 minutes: nothing is recorded, and the cat monitor has nothing to read."
      - alert: FrigateMetricsMissing
        expr: absent(frigate_camera_fps)
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Frigate: not reporting"
          description: "Frigate is down or its metrics address changed."
      - alert: FrigateDetectorSlow
        expr: frigate_detector_inference_speed_seconds > 0.1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Frigate: detection slow ({{ $value | humanizeDuration }} per frame)"
          description: "Normally about 10 ms on the Intel GPU (OpenVINO). Slower means it fell back to the CPU or the GPU is busy."
      - alert: FrigateStorageLow
        expr: frigate_storage_free_bytes / frigate_storage_total_bytes < 0.10
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Frigate: storage {{ $labels.storage }} under 10% free"
          description: "Recordings are kept 14 days; less free space means Frigate will cut them shorter."

  # Free Motion, from fm-metrics (fm-metrics.yaml reads its files). Made 2026-11-26 after the live check failed unseen
  # for 14 days: fixed limits that work from the first scrape (Prometheus keeps 15 days, so a learned baseline would
  # have learned the outage), and baselines computed by fm-metrics from the files' own history, the outage left out.
  # Each was checked against past files: it fires on the incidents named and stays quiet on 2026-11-26 19:10.
  # Not alerted on purpose: the scan's HTTP 429s (parked), "daily quota used up" and model 503s (every day).
  - name: free-motion
    rules:
      - alert: FreeMotionLiveCheckCrashing
        expr: |
          fm_live_check_crashes_24h > 20
          and fm_live_check_crashes_24h > 0.2 * scalar(sum(fm_live_checks_24h))
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Free Motion: the live check crashes ({{ $value }} postings in 24 h)"
          description: "The check that a posting is still open fails before any page loads, so those postings are skipped as uncertain and never applied to (2026-11-12..26: Chromium missing from the image, 2,633 skipped in one day). Reasons: grep 'check failed' /fm/fm-data/tmp/fm/night/dead.txt in fm-controller. Clears 24 h after the fix, or at once if the failed entries are removed from data/posting-liveness.json."
      - alert: FreeMotionPoolStarved
        expr: |
          fm_pool_list < 20 and fm_pool_live_skipped > 200 and fm_pool_kept > 500
          and (time() - fm_pool_build_timestamp_seconds) < 6 * 3600
          and on () fm_auto_apply_enabled == 1
        for: 2h
        labels: { severity: critical }
        annotations:
          summary: "Free Motion: rounds get almost no jobs ({{ $value }} in the last list)"
          description: "Hundreds of jobs pass the rules, but nearly all are skipped as dead or unclear, for 2 hours of rounds. Seen 2026-11-26 (0-6 jobs of 2,800 kept: the live check broken) and 2026-10-30 afternoon (0 of 636). Why each was skipped: /fm/fm-data/tmp/fm/night/dead.txt; the summary: the last 'live check:' lines of tmp/fm/night/full-night.log."
      - alert: FreeMotionFewApplications
        expr: |
          sum without (outcome) (fm_submissions_24h{outcome="submitted"}) < 0.3 * fm_baseline_submitted_daily
          and fm_baseline_days >= 7
          and on () fm_auto_apply_enabled == 1 and on () fm_drivers_allowed > 0
        for: 6h
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: few applications sent ({{ $value }} in 24 h)"
          description: "Under 30% of the usual day (the median of the last 14 normal days) while auto-apply is on and a driver may apply. Look at the rounds (tmp/fm/scheduled/night-<today>.log) and the alerts above it. Days like this before: 2026-10-27/28, 2026-11-03/04, 2026-11-13..20."
      - alert: FreeMotionFailuresHigh
        expr: |
          (
            sum(fm_submissions_24h{outcome=~"errored|validation-failed|captcha|blocked-waf"})
            / sum(fm_submissions_24h{outcome=~"submitted|already-applied|errored|validation-failed|captcha|blocked-waf"})
          ) > 0.4
          and on () (
            sum(fm_submissions_24h{outcome=~"errored|validation-failed|captcha|blocked-waf"})
            / sum(fm_submissions_24h{outcome=~"submitted|already-applied|errored|validation-failed|captcha|blocked-waf"})
          ) > 2 * scalar(fm_baseline_failed_share)
          and on () sum(fm_submissions_24h{outcome=~"submitted|already-applied|errored|validation-failed|captcha|blocked-waf"}) >= 20
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: {{ $value | humanizePercentage }} of applications fail"
          description: "Over 40% of the last 24 h's finished tries ended errored, failed validation, at a captcha or a firewall, and over twice the usual share (about 20%). Seen 2026-10-28 (85%) and 2026-11-03 (81%). Which: the outcome column of data/freemotion-submissions.tsv."
      - alert: FreeMotionNoPoolBuild
        expr: time() - fm_pool_build_timestamp_seconds > 26 * 3600 and on () fm_auto_apply_enabled == 1
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: no list of jobs built in over a day"
          description: "Neither the 06:00 scan nor any round made a pool: the daemon, the scan or the rounds stopped. kubectl -n apps logs deploy/fm-controller, and tmp/fm/scheduled/daemon-<today>.log."
      - alert: FreeMotionHubAgentSilent
        expr: time() - fm_hub_agent_last_report_timestamp_seconds > 7.5 * 3600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: the dashboard's agent sent nothing for {{ $value | humanizeDuration }}"
          description: "It recycles every 6 h and reports each time. Silent longer means it hung, so the dashboard shows old numbers (2026-11-21 13:30 to 11-23 14:53; also silent 11-13..20). Fix: SIGTERM it in fm-controller (ps | grep hub-agent); the daemon starts a new one. Watchdog: fm-agent#5."
      - alert: FreeMotionGmailOverQuota
        expr: fm_gmail_overquota_today > 0
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: Gmail refuses mail reads ({{ $value }} OVERQUOTA today)"
          description: "Gmail's daily IMAP limit is used up: reply checks and the agents' verification emails fail until it resets. Seen 2026-11-21..25. Which job: grep OVERQUOTA tmp/fm/scheduled/*-<today>.log."
      - alert: FreeMotionScoreLoopHeapAbort
        expr: increase(fm_score_loop_heap_aborts[1h]) > 0
        labels: { severity: warning, kind: event }
        annotations:
          summary: "Free Motion: a score loop ran out of memory"
          description: "Its keeper restarts it in 5 minutes. Often means the scan history grew; see tmp/fm/scheduled/loops.err and the memory notes in services.yaml (fm-pool#7)."
      - alert: FreeMotionJobFailing
        expr: fm_daemon_job_failures_24h >= 3
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: {{ $labels.job }} failed {{ $value }} times in 24 h"
          description: "The daemon's {{ $labels.job }} job keeps ending with an error (none did from 2026-11-01 to 11-26). Its log: tmp/fm/scheduled/{{ $labels.job }}-<today>.log, or night-<today>.log for rounds."
      # Added 2026-11-27: applying now pauses on a job while no CV or letter writer can write (the user's rule), so a
      # writer outage is a silent stop; and FewApplications stays quiet while no driver may apply.
      - alert: FreeMotionWaitingForWriter
        expr: |
          fm_applying_paused_for_writer == 1
          or (fm_writers_free == 0 and on () fm_auto_apply_enabled == 1)
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "Free Motion: applying is paused, no CV or letter writer can write"
          description: "A job waits for a writer instead of going out with the generic CV (the user, 2026-11-27), so nothing is sent until one is back. Short pauses of a few minutes while ChatGPT is busy are normal (2026-11-27 02:25 and 05:31) and don't reach 30 minutes. Who is out and until when: ls tmp/fm/night/out (each file holds the epoch second it is back; Grafana: fm_out_until_timestamp_seconds); why: grep 'no writer answered' tmp/fm/night/full-night.log. A signed-out website writer also opens an agent-inbox item."
      - alert: FreeMotionNoDriver
        expr: fm_drivers_usable == 0 and on () fm_auto_apply_enabled == 1
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: no driver can apply"
          description: "Every driver is off, paused by auto-apply's rules, or out at a limit or a sign-out for 2 hours, so rounds don't start (and FreeMotionFewApplications stays quiet while none may apply). Why each one: node freemotion-night/burn.mjs status in fm-controller, and ls tmp/fm/night/out."
      - alert: FreeMotionDaemonStalled
        expr: |
          time() - fm_daemon_job_last_end_timestamp_seconds{job="burn"} > 40 * 60
          or (absent(fm_daemon_job_last_end_timestamp_seconds{job="burn"}) and on () fm_source_ok{source="daemon"} == 1)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Free Motion: the daemon has stopped running its jobs"
          description: "The burn tick runs every 10 minutes, whether auto-apply is on or off, and logs 'burn: ended'. None for 40 minutes means scheduled.mjs daemon hung or died while the pod still looks Running (the controller has no liveness probe). tmp/fm/scheduled/daemon-<today>.log; kubectl -n apps logs deploy/fm-controller."
      - alert: FreeMotionSignedOut
        expr: |
          time() - fm_signed_out_note_timestamp_seconds < 6 * 3600
          or time() - fm_inbox_signed_out_opened_timestamp_seconds < 7 * 86400
        labels: { severity: warning }
        annotations:
          summary: "Free Motion: {{ $labels.who }} is signed out"
          description: "agy: run.sh found its Google sign-in gone; run `agy` once by hand in fm-controller to sign in (it is skipped, re-checked hourly, until then). A website writer (chatgpt, gemini): the open agent-inbox item says the command; close the item once signed in. Items older than 7 days stop alerting. Not seen by Free Motion at all: a signed-out Claude account, codex or copilot (they look like failures)."
      - alert: FreeMotionMetricsBroken
        expr: fm_source_ok == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Free Motion's numbers: can't read {{ $labels.source }}"
          description: "fm-metrics fails on one of its files (moved, renamed or a new format), so the Free Motion alerts from it can't fire. kubectl -n monitoring logs deploy/fm-metrics."
      - alert: FreeMotionMetricsMissing
        expr: absent(fm_source_ok)
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Free Motion's numbers: not reporting"
          description: "fm-metrics is not running or not scraped, so none of the Free Motion alerts can fire. kubectl -n monitoring get pods -l app=fm-metrics."
      - alert: FreeMotionMetricsStale
        expr: |
          time() - fm_source_mtime_seconds{source="liveness"} > 26 * 3600
          and on () (time() - fm_pool_build_timestamp_seconds) < 6 * 3600
        labels: { severity: warning }
        annotations:
          summary: "Free Motion's numbers: the live-check cache looks frozen"
          description: "Rounds build lists, but data/posting-liveness.json hasn't changed in a day. Either the live check stopped writing it, or the file was replaced by a rename and fm-metrics still reads the old one (its file mounts follow the inode): kubectl -n monitoring rollout restart deploy/fm-metrics."

  - name: monitoring
    rules:
      - alert: AlertEmailsFailing
        expr: increase(alertmanager_notifications_failed_total[30m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Alerts: emails can't be sent"
          description: "Gmail refused or timed out. Alerts are only visible in Prometheus and Grafana until this is fixed (Secret tools/alert-smtp)."
      - alert: PrometheusRuleErrors
        expr: increase(prometheus_rule_evaluation_failures_total[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Alerts: some rules fail to run"
          description: "A rule in alert-rules.yml has an error: those alerts can't fire."
      - alert: PrometheusAlertmanagerUnreachable
        expr: prometheus_notifications_alertmanagers_discovered < 1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Alerts: Prometheus can't reach Alertmanager"
          description: "No alert emails will be sent. Is tools/alertmanager running?"
