# Who is using the Acer's GPU: one metric per GPU process, with the pod it belongs to.
# nvidia_gpu_exporter (gpu-exporter.yaml) only knows the whole GPU. This reads `nvidia-smi` per process (memory,
# and pmon's SM %) and each process's cgroup, which names its pod (by uid) and container; Grafana joins the uid to
# kube_pod_info for the pod's name. hostPID so the driver's process ids are this pod's too; no device plugin needed.
#   gpu_process_memory_bytes{pid, pod_uid, container_id, command}
#   gpu_process_sm_percent{...}     share of the GPU's compute it used in the last second
#   gpu_processes                   how many processes are on the GPU
# Plain python:3.13-slim with the script below (standard library only), scraped through the pod annotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-procs
  namespace: monitoring
data:
  gpu_procs.py: |
    import http.server, os, re, subprocess

    POD = re.compile(r"pod([0-9a-f_-]{36})\.slice")
    CTR = re.compile(r"cri-containerd-([0-9a-f]{12,64})\.scope")

    def smi(*args):
        return subprocess.run(["nvidia-smi", *args], capture_output=True, text=True, timeout=10).stdout

    def label(v):
        # cut first, then escape: a cut after escaping can leave a lone backslash that breaks the scrape
        return str(v)[:100].replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ")

    def owner(pid):
        try:
            cg = open(f"/proc/{pid}/cgroup").read()
        except OSError:
            return "", ""
        p, c = POD.search(cg), CTR.search(cg)
        return (p.group(1).replace("_", "-") if p else ""), (c.group(1)[:12] if c else "")

    def command(pid, fallback):
        try:
            parts = open(f"/proc/{pid}/cmdline", "rb").read().split(b"\0")
            words = [os.path.basename(w.decode(errors="replace")) for w in parts if w][:4]
            return " ".join(words) or fallback
        except OSError:
            return fallback

    def metrics():
        lines = ["# TYPE gpu_process_memory_bytes gauge", "# TYPE gpu_process_sm_percent gauge",
                 "# TYPE gpu_processes gauge"]
        apps = []
        for row in smi("--query-compute-apps=pid,used_memory,process_name", "--format=csv,noheader,nounits").splitlines():
            parts = [p.strip() for p in row.split(",")]
            if len(parts) >= 3 and parts[0].isdigit():
                try:
                    mib = float(parts[1])
                except ValueError:          # "[N/A]" on some drivers: count the process, memory unknown
                    mib = 0.0
                apps.append((parts[0], mib, parts[2]))
        sm = {}
        head = None
        for row in smi("pmon", "-c", "1", "-s", "u").splitlines():
            if row.startswith("# gpu"):
                head = row[1:].split()
            elif head and not row.startswith("#"):
                cols = dict(zip(head, row.split()))
                if cols.get("pid", "-").isdigit():
                    try:
                        sm[cols["pid"]] = float(cols.get("sm", "-"))
                    except ValueError:
                        pass
        for pid, mib, name in apps:
            uid, ctr = owner(pid)
            lab = f'pid="{pid}",pod_uid="{uid}",container_id="{ctr}",command="{label(command(pid, name))}"'
            lines.append(f"gpu_process_memory_bytes{{{lab}}} {mib * 1048576:.0f}")
            lines.append(f"gpu_process_sm_percent{{{lab}}} {sm.get(pid, 0):g}")
        lines.append(f"gpu_processes {len(apps)}")
        return "\n".join(lines) + "\n"

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404); self.end_headers(); return
            try:
                body, code = metrics().encode(), 200
            except Exception as e:
                body, code = f"# error: {e}\n".encode(), 500
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *a):
            pass

    http.server.ThreadingHTTPServer(("", 9837), Handler).serve_forever()
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-procs
  namespace: monitoring
  labels: { app: gpu-procs }
spec:
  selector:
    matchLabels: { app: gpu-procs }
  template:
    metadata:
      labels: { app: gpu-procs, app.kubernetes.io/name: gpu-procs }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9837", prometheus.io/path: /metrics }
    spec:
      runtimeClassName: nvidia
      hostPID: true
      nodeSelector: { kubernetes.io/hostname: acer-laptop }
      tolerations:
        - { key: dedicated, value: worker, effect: NoSchedule }
      priorityClassName: homelab-critical
      containers:
        - name: gpu-procs
          image: docker.io/library/python@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90   # 3.13-slim
          command: ["python", "/app/gpu_procs.py"]
          env:
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: utility }
          ports:
            - { name: metrics, containerPort: 9837 }
          volumeMounts:
            - { name: script, mountPath: /app, readOnly: true }
          # Not root, no capabilities: with hostPID it still reads every process's cgroup and command line
          # (world-readable), but not other containers' environment or files.
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: script
          configMap: { name: gpu-procs }
