# PROPOSAL, NOT APPLIED (Infra#14). It is under docs/ on purpose: Flux applies only k8s/. To use it, after the
# decisions in docs/gpu-queue.md: move it to k8s/apps/gpu-queue/gpu-queue.yaml, fix the marked lines, add the
# services.yaml entries from docs/gpu-queue.md, commit and push.
#
# The GPU work queue's hub (gpu-queue/hub.py): a list of work items with leases, over HTTP. Workers (the PC first)
# claim an item, download its input, upload the result. This draft puts it on the Acer, next to bg-taste-match's audio
# and captions (option A in docs/gpu-queue.md), so it writes the captions where the Acer's own Whisper job does.
# Standard library only: it runs in any Python 3.11+ image. The lab's image is already on the Acer (pull Never).
# Code: gpu-queue/hub.py, workqueue.py and kinds.json copied to /srv/apps/gpu-queue/code on the Acer (by hand, like
# the lab's catalog).
# Secret (not in this repo): kubectl -n apps create secret generic gpu-queue --from-literal=token=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-queue
  namespace: apps
  labels: { app: gpu-queue }
spec:
  replicas: 1
  strategy: { type: Recreate }        # one writer of queue.db
  selector:
    matchLabels: { app: gpu-queue }
  template:
    metadata:
      labels: { app: gpu-queue }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8795", prometheus.io/path: /metrics }
    spec:
      nodeSelector: { kubernetes.io/hostname: acer-laptop }
      tolerations:
        - { key: dedicated, value: worker, effect: NoSchedule }
      # TO DECIDE: batch-mid ranks it with Whisper (if it is pushed out, the PC only finds no hub and waits).
      priorityClassName: batch-mid
      containers:
        - name: hub
          image: docker.io/library/lab:2026-11-25-feeding     # CHECK: any image with Python 3.11+ on the Acer
          imagePullPolicy: Never
          command: ["python", "/code/hub.py", "serve", "--db", "/srv/gpu-queue/queue.db", "--kinds", "/code/kinds.json",
                    "--port", "8795"]
          ports:
            - { name: http, containerPort: 8795 }
          env:
            - name: GPUQ_TOKEN
              valueFrom: { secretKeyRef: { name: gpu-queue, key: token } }
          # CHECK on the Acer: the owner of /srv/apps/bg-taste-match/captions. The bg-taste-match pods run as the
          # image's user; the hub must be able to write there (runAsUser to match).
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 60
            failureThreshold: 3
          resources:
            # Not measured yet: an idle stdlib HTTP server is ~20 MiB; serving an input streams it in 1 MiB pieces.
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: code, mountPath: /code, readOnly: true }
            - { name: state, mountPath: /srv/gpu-queue }
            - { name: audio, mountPath: /data/bg-taste-match-audio, readOnly: true }
            - { name: captions, mountPath: /data/bg-taste-match/captions }
      volumes:
        - name: code
          hostPath: { path: /srv/apps/gpu-queue/code, type: Directory }
        - name: state
          hostPath: { path: /srv/apps/gpu-queue, type: Directory }
        - name: audio
          hostPath: { path: /var/lib/bg-taste-match/audio, type: Directory }
        - name: captions
          hostPath: { path: /srv/apps/bg-taste-match/captions, type: Directory }
---
# Workers on the home network: NodePort, token required (as the lab's PC intake, 30881).
apiVersion: v1
kind: Service
metadata:
  name: gpu-queue
  namespace: apps
spec:
  type: NodePort
  selector: { app: gpu-queue }
  ports:
    - { name: http, port: 8795, targetPort: http, nodePort: 30895 }
---
# Filling the queue: every 6 hours, every audio file without captions and without a .tries file (the Acer is on it
# or gave up) becomes an item. TO DECIDE: this or bg-taste-match's fetch job adding items (docs/gpu-queue.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-queue-fill
  namespace: apps
  labels: { app: gpu-queue }
spec:
  schedule: "40 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: { app: gpu-queue, stage: fill }
        spec:
          restartPolicy: Never
          nodeSelector: { kubernetes.io/hostname: acer-laptop }
          tolerations:
            - { key: dedicated, value: worker, effect: NoSchedule }
          priorityClassName: batch-low
          containers:
            - name: fill
              image: docker.io/library/lab:2026-11-25-feeding
              imagePullPolicy: Never
              command: ["python", "/code/hub.py", "fill", "whisper", "--db", "/srv/gpu-queue/queue.db",
                        "--kinds", "/code/kinds.json"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts:
                - { name: code, mountPath: /code, readOnly: true }
                - { name: state, mountPath: /srv/gpu-queue }
                - { name: audio, mountPath: /data/bg-taste-match-audio, readOnly: true }
                - { name: captions, mountPath: /data/bg-taste-match/captions, readOnly: true }
          volumes:
            - name: code
              hostPath: { path: /srv/apps/gpu-queue/code, type: Directory }
            - name: state
              hostPath: { path: /srv/apps/gpu-queue, type: Directory }
            - name: audio
              hostPath: { path: /var/lib/bg-taste-match/audio, type: Directory }
            - name: captions
              hostPath: { path: /srv/apps/bg-taste-match/captions, type: Directory }
