    - "Books 400Mi since 2026-11-24 (was 700Mi; uses ~1.24 GiB plus swap): below its use on purpose, so it fits back in sooner. Over its booking and ranked steps-aside, it is among the first pushed out when the Acer's memory runs low (memory eviction, Infra README 'Memory on the Acer')."
