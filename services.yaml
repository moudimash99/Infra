# services.yaml: every service that runs at home, one entry per service (related workloads grouped).
# Where it runs (k3s node, Docker on the server, the PC's Task Scheduler), its image, data, code, how it is deployed,
# how to tell it is healthy, and where the repo, the README and the live state disagree ("drift").
#
# Update this file in the same change as any deploy, move, schedule change or new service. A deploy that is not
# written here is drift by definition.
#
# Snapshot: 2026-11-20 ~16:00-16:20 Paris, read-only (kubectl get, docker ps, git log/status, schtasks).
# The Acer (acer-laptop) was NotReady at the start (being restored) and came back Ready during the survey;
# its pods were Running again at the end, except node-exporter there (CrashLoopBackOff).
# Machines: server = moudimash99, 192.168.1.116 (control plane, Docker). Acer = acer-laptop, 192.168.1.93
# (worker, taint dedicated=worker:NoSchedule, label role=worker). PC = this Windows machine, 192.168.1.26.
# Infra repo: the live cluster matches branch acer-jobs-and-alerts (a72c6cb, 2026-11-12), NOT main (see k3s-system).
# Times are Paris unless marked UTC. "pull Never" = the image was imported by hand onto that node's containerd.

