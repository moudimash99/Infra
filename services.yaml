- name: mail-classifier
  what: "Trained mail classifier API for the Gmail archiver. Since 2026-11-11 it decides (archiver MODEL_DECIDES = True): it archives emails the rules keep when it is sure and no guard or block applies. If it does not answer within 3 s, the email stays in the inbox."
  kind: web-app
  system: gmail
  lifecycle: production
  depends_on: []
  runs: "k8s apps/Deployment mail-classifier on acer-laptop (rank steps-aside since 2026-11-20, strategy Recreate; 0 or 1 copy at night since 2026-11-21, owned by apps/Deployment mail-classifier-waker)"
  manifest: Email-remove/ml/service/mail-classifier.yaml (NOT in Infra/k8s; image line holds the placeholder MODEL_TAG)
  image: "mail-classifier, tag = model version (pull Never)"
  schedule: null
  url: "http://mail-classifier.apps.svc.cluster.local/classify in the cluster (the archiver, the lab); NodePort 30880 on every node for the home network; both reach the waker, which passes calls to Service mail-classifier-backend; GET /waker answers without waking it; no Ingress, private email text"
  data:
    - "none (model baked into the image)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\Email-remove\ml\service (app.py, Dockerfile, build-context.ps1; repo github.com/moudimash99/Email-remove, private, since 2026-11-22); model from Email-remove\ml (not in git)
    branch: main
    deployed: "both-20261110-r2 (files dated 2026-11-10 00:32-00:53)"
  deploy: >-
    build-context.ps1 on the PC, docker build on the server, import on the Acer, replace MODEL_TAG in
    mail-classifier.yaml, kubectl apply.
  check: "Readiness/liveness GET /health on :8080 (the waker: /waker on :8933; `kubectl -n apps logs deploy/mail-classifier-waker` shows each stop and start); Prometheus scrapes /metrics via pod annotations; ml/service/remote_check.py against :30880"
  probes:
    - {k8s: apps/Deployment/mail-classifier-waker}
    - {k8s: apps/Deployment/mail-classifier, on_demand: true}
    - {http: "http://192.168.1.116:30880/waker", expect: [200]}
  drift:
    - "Live in the cluster but not in Infra/k8s and not in the README; its manifest lives in Email-remove (in git since 2026-11-22)."
  notes:
    - "Called by the Gmail archiver (CronJob apps/email-remove on the Acer since 2026-11-20; shadow.py)."
    - "Rank steps-aside (22000, 2026-11-20): cat flash (00:20, 19:20, ~4 min) and BoardGameFinder (05:00, ~1 h) may stop it to get its memory; its Deployment brings it back when they end. The archiver keeps the emails it could not classify in state.json model_waits and asks again once it answers (user: off at night is fine \"as long as by time i wake up it ran\")."
    - "Asleep at night when idle since 2026-11-21 (user: off at night is fine as long as it ran by the morning): mail-classifier-waker stops it after 30 min without a call between 23:00 and 07:00 and starts it at 07:00; in the day it never stops it. A call wakes it in about 80 s: the archiver gets 503 (ASK_WAIT_S 2, under its 3 s), the email waits in model_waits and is asked next run. The lab's mail page and remote_check.py call /health and wake it too. Tested 2026-11-21 02:31: stopped by hand, back in 77 s. Manifest backup: mail-classifier.yaml.before-waker-2026-11-21."
    - "After a restart the first answers can take over 3 s (model warm-up): the archiver then marks it down for that run and asks again next run."
  menu:
    title: Mail classifier
    icon: mdi-email-search
    description: Decides for the archiver; asleep at night when idle
    pods: apps/app=mail-classifier-waker

