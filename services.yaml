- name: gmail-archiver
  what: >-
    Every 3 minutes, archives job rejections, application confirmations and job-board notices in the user's 3 Gmail
    accounts (labels Auto-*). It asks the mail-classifier about the emails its rules keep (the classifier decides since
    2026-11-11) and Gemma (llm-gateway) about the unsure ones.
  kind: scheduled-job
  runs: "k8s apps/CronJob email-remove on acer-laptop since 2026-11-20; the PC task \\GmailRejectionArchiver is disabled (moved)"
  manifest: Infra/k8s/apps/email-remove/email-remove.yaml
  image: "docker.io/library/python:3.13-slim (IfNotPresent; standard library only; the code comes from the hostPath)"
  schedule: "*/3 * * * * Europe/Paris (Forbid, startingDeadlineSeconds 120, activeDeadlineSeconds 1800); rank batch-high: waits for room, never pushes anyone out"
  url: null
  data:
    - "Acer hostPath /srv/apps/email-remove (uid 1000, mode 700): the .py files, state.json (kept, gemma_tries, model_waits), templates.json, approved.json, shadow.jsonl, gemma.jsonl, archiver.log. Private email text: never in a repo or image."
    - "Secret apps/email-remove (ACCOUNT_1..3_EMAIL / _PASSWORD, Gmail app passwords), made from the PC's .env"
    - "PC copy Email-remove\\Email-remove: staging and fallback (MOVED-TO-ACER.txt; main.py refuses a live run there while that file exists)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\Email-remove\Email-remove (no git; dated backups beside it, latest Email-remove.backup-2026-11-20; staging Email-remove.staging-2026-11-20)
    branch: "none: not a git repo"
    version_check: none (compare the .py files with the Acer's copy)
    deployed: "2026-11-20 20:42: the PC's files, with the model_waits fix (archiver.py, shadow.py, test_model_waits.py) and the moved-guard in main.py"
  deploy: >-
    Stage and replay on the PC first (the user's policy), then copy only the changed .py files:
    scp <file>.py moudimash99@192.168.1.93:/srv/apps/email-remove/. Never copy state.json or the .jsonl files from the
    PC over the Acer's: the Acer's are the live ones.
  check: "kubectl -n apps get jobs -l app=email-remove; kubectl -n apps logs job/<newest>; a good run every 3 min"
  probes:
    - {k8s: apps/CronJob/email-remove, max_age_h: 2}
  drift: []
  notes:
    - "Moved from the PC on 2026-11-20 (user: \"acer should be running jobs and pc not\"). Cut-over at 20:42: the PC task disabled right after its run, state copied, CronJob unsuspended. Going back: see MOVED-TO-ACER.txt in the PC folder."
    - "model_waits (2026-11-20): an email the classifier could not answer about is no longer cached as kept for good. It waits, and it is classified again once the classifier answers; while the classifier is down, waiting emails are not downloaded again. Unit test: test_model_waits.py. Replay: same classifier decisions as the old code on a day of mail (old on the PC, new on the Acer: the same 4 model archives, 129/129 answered)."
    - "Catch-up at the move: 415 emails kept between 13 and 20 Nov without the classifier's answer (the Acer was down) were put back to be classified (account 1: 255, account 2: 41, account 3: 119). The first run (20:42) still had the old 15 min limit and stopped after archiving 10; the second (20:58, 30 min limit) finished with 20 more: 30 archived in all. Gemma's leftovers (2 min per account per run) cleared over the next runs."
    - "Live test 2026-11-20 21:21: a stand-in pod with cat-flash's rank pushed out the classifier only (event Preempted); the archiver run meanwhile marked 37 emails as waiting; the classifier came back 22 s after the stand-in ended and the next run classified all 37."
    - "At 05:00 BoardGameFinder takes the classifier's memory for ~1 h, and the archiver itself may not fit then: a run or two is skipped; the next ones catch up."
    - "One-off checks \\EmailRemoveFirstDayCheck (2026-11-12 18:15) and \\EmailRemoveWeekCheck (2026-11-18 18:15) ran ml\\first_day_check.py, result 0, no next run: finished."

- name: gmail-daily-review
  what: Daily review email of the archiver's decisions (Email-remove daily_review.py, with ml/audit.py's model check).
  kind: pc-task
  runs: "PC Task Scheduler \\GmailDailyReview (Ready): pythonw review_with_acer_files.py"
  manifest: null
  image: null
  schedule: "daily 17:00"
  url: null
  data:
    - "Email-remove\\Email-remove review.log, review_state.json (PC)"
    - "shadow.jsonl, gemma.jsonl, archiver.log: copied from the Acer's /srv/apps/email-remove by review_with_acer_files.py before each review (each only if the copy worked; the records only if they did not shrink; a half-written last line dropped)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\Email-remove\Email-remove
    branch: "none: not a git repo"
    deployed: "in place (daily_review.py 2026-11-11 19:05; review_with_acer_files.py 2026-11-20)"
  deploy: "Edit in place."
  check: "Good run within 48 h"
  probes:
    - {pc_task: "\\GmailDailyReview"}
  drift:
    - "Still a PC job: the review asks codex, the Gemini website, agy and two Claude accounts through this PC's command-line logins (REVIEW_LLMS), and ml/audit.py uses Claude. Moving it to the Acer means either fresh logins on the cluster or switching its reviewers to the llm-gateway: the user's call (parked 2026-11-20)."
  notes:
    - "Since 2026-11-20 the archiver runs on the Acer, so the review's wrapper copies its records here first (REVIEW_COPY_ONLY=1 runs just the copy)."

- name: job-scrapers
  what: Upwork job scan four times a day (plus two finished keyword/search test tasks).
  kind: pc-task
  runs: "PC Task Scheduler \\job-scrapers upwork round (Ready); \\job-scrapers keyword test and \\job-scrapers new search test (Disabled)"
  manifest: null
  image: null
  schedule: "upwork round daily 08:45, 12:30, 15:45, 19:00 (`python -u upwork_scan.py >> data\\upwork-run.log`)"
  url: null
  data:
    - "job-scrapers\\data on the PC (upwork-run.log, keywords-run.log, newsearch-run.log)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\job-scrapers (github.com/moudimash99/job-scrapers)
    branch: main
    latest: "3a6fd2a 2026-11-01 04:35 Add the daily keyword test against the IT lists"
    deployed: "runs in place from the working tree"
    uncommitted: "20 (17 untracked)"
  deploy: "Edit in place."
  check: "Good run within 28 h (longest gap 13 h 45 x 2). Halted since 2026-11-10 08:46: every run prints \"halted\" and returns 1."
  probes:
    - {pc_task: "\\job-scrapers upwork round"}
  drift:
    - "The upwork round runs uncommitted code (20 changed files) and its last run failed (result 1)."
  notes:
    - "keyword test ran 2026-11-02..05 (result 0); new search test ran 2026-11-05..08 (last result 1). Both disabled, no more triggers."
    - "upwork round calls `python` from PATH (anaconda), unlike the other tasks' full path."
    - "Halted on purpose since 2026-11-10 08:46: Upwork sent the scan to its sign-in page, so it wrote data\\upwork-stopped.txt and runs nothing until the user signs in again (python upwork_scan.py --rescue opens a visible window) and removes that file. Needs the user."
    - "Still a PC job (2026-11-20): its Upwork sign-in lives in a Camoufox profile on this PC. Moving it to the Acer means signing in to Upwork in a browser profile there: parked for the user, together with the sign-in."

