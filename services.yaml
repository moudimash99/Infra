# services.yaml: the catalog of everything that runs at home, one entry per service (related workloads grouped).
# Shaped loosely like Backstage's software catalog: an entry holds what only changes when someone changes the service
# (what it is, where it runs, its code and data, how to deploy and check it). Live state is NOT written here:
# scripts/status.py reads it each run (is it up, the image that runs, commits not deployed or not pushed, uncommitted
# changes, anything running without an entry).
#
# Fields, in order:
#   name, what
#   kind        web-app | scheduled-job | tool | monitoring | cluster | pc-task
#   system      the product it belongs to (website, board-games, cats, free-motion, gmail, job-scrapers, lab,
#               monitoring, platform); menus and lists group by it
#   lifecycle   production | experimental | deprecated
#   depends_on  entries it needs in order to work, beyond what everything uses (k3s-system, edge-proxy)
#   runs, manifest
#   image       which image and how it is built, without the tag (status.py prints the one that runs)
#   schedule, url, data
#   code        repo (status.py cuts it at " (" and expands globs like fm-*), branch, version_check (see status.py),
#               libs (library repos built into the image), and `deployed` ONLY where status.py cannot tell: no git,
#               copied by hand, built from uncommitted files, or a tag that does not name the code
#   deploy, check
#   probes      what status.py checks
#   drift       where the repo, the README and what runs disagree, dated
#   notes
#   menu        its tile on lab.machaka.net (title, icon, description, href, pods, ping, widget, extra, hide).
#               scripts/menu.py makes the whole menu from this file, grouped by system (its docstring has the rules)
# status.py also reports mistakes in system, lifecycle and depends_on.
#
# Update an entry in the same change as any move, schedule change, new service or change in how it is deployed. A
# plain redeploy needs no edit, except where code.deployed is written by hand. Something running without an entry is
# drift by definition. First survey: 2026-11-20 (read-only: kubectl, docker ps, git, schtasks); drift and notes carry
# the date they were seen.
# Machines: server = moudimash99, 192.168.1.116 (control plane, Docker). Acer = acer-laptop, 192.168.1.93
# (worker, taint dedicated=worker:NoSchedule, label role=worker). PC = this Windows machine, 192.168.1.26.
# Repos: one branch each, main (master for BoardXplorer and BoardGameFinder), the same on the PC, GitHub and the
# server's clones since 2026-11-22. Each repo's README has a "Where it runs" section made from its entry here
# (scripts/readmes.py).
# Times are Paris unless marked UTC. "pull Never" = the image was imported by hand onto that node's containerd.

