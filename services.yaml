- name: free-motion
  what: Free Motion job-application automation (controller daemon, one browser per lane, the ChatGPT/Gemini website writer).
  kind: scheduled-job
  system: free-motion
  lifecycle: production
  depends_on: [freemotion-hub, nfs-exports]
  runs: >-
    k8s apps/Deployment fm-controller on moudimash99; apps/StatefulSet fm-browser-acer (2 pods), apps/Deployment
    fm-webllm (0 or 1 copy, started on demand) and apps/Deployment fm-webllm-waker on acer-laptop. PC Task Scheduler
    copies disabled.
  manifest:
    - Infra/k8s/apps/fm-controller/fm-controller.yaml (+ move/ scripts)
    - Infra/k8s/apps/fm-browser/fm-browser.yaml (headless Service + NetworkPolicy, controller only)
    - Infra/k8s/apps/fm-webllm/fm-webllm.yaml (Service fm-webllm :8933 -> the waker; Service fm-webllm-backend -> the helper; the waker's ConfigMap, ServiceAccount/Role (scale fm-webllm only); NetworkPolicies, controller and bg-taste-match)
  image: "fm for all three, built on the server from Infra/images/fm, ~8 GB (pull Never)"
  schedule: "fm-orchestrator `scheduled.mjs daemon` inside the controller (Task Scheduler's stand-in); rounds, burn, replies, scan, weekly, loops"
  url: "none of its own (dashboard = freemotion-hub); browsers at <pod>.fm-browser.apps.svc:8931/mcp, writer at fm-webllm.apps.svc:8933 (the waker, which starts the helper)"
  data:
    - "server hostPaths: /srv/apps/freemotion/ws (code), /srv/apps/freemotion/fm-data (data, .env), /srv/apps/freemotion/home (driver logins, transcripts)"
    - "NFS from the server to the Acer: /srv/apps/freemotion/fm-data (rw, browsers) and /srv/apps/freemotion/ws (ro, fm-webllm)"
    - "Acer hostPaths: /srv/apps/freemotion-browser/<pod> (browser profiles, uid 1000), /srv/apps/freemotion-webllm/web-llm (signed-in ChatGPT profile, cookies)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\fm\fm-* (deployed checkouts in /srv/apps/freemotion/ws, fed from bare repos /srv/apps/freemotion/git)
    branch: main everywhere
    version_check: "checkout moudimash99@192.168.1.116:/srv/apps/freemotion/ws"
  deploy: >-
    Code: push from the PC to the server's bare repos, then `git pull` in /srv/apps/freemotion/ws between rounds
    (restart fm-webllm/llm-gateway after). Image: build images/fm on the server, `docker save fm:<tag> | ssh <node>
    sudo k3s ctr images import -` on each node, set the tag, apply. The registry is not used yet.
  check: >-
    fm-controller pod Running (no probe; watch restarts/OOM, limit 4Gi); fm-browser-acer-0/-1 Ready (tcpSocket :8931);
    fm-webllm-waker Ready (GET /waker); fm-webllm at 0 copies is normal (on demand), 1 copy Ready while it is used
    and for 30 min after (`kubectl -n apps logs deploy/fm-webllm-waker` shows each start and stop); the hub shows new
    rounds.
  probes:
    - {k8s: apps/Deployment/fm-controller}
    - {k8s: apps/StatefulSet/fm-browser-acer}
    - {k8s: apps/Deployment/fm-webllm-waker}
    - {k8s: apps/Deployment/fm-webllm, on_demand: true}
  drift:
    - "The image predates two images/fm commits (b161c73 shared browser context, b10d975 dbus env); fm-browser.yaml spells the browser args out until the next build."
  notes:
    - "Memory fix (fm-pool#7) live since 2026-11-21 ~11:18: score loops run with --max-old-space-size=384 under a bash keeper (each end logged in fm-data/tmp/fm/scheduled/loop-<name>.err; a heap abort restarts in 5 min), the hub agent with a 384 MB cap. Before it, the loops reached 0.7 and 1.2 GB RSS (11:15). Check after each 06:00 scan: controller restarts, the .err files for 'heap limit'. Since 2026-11-24 02:49 the three loops run as ONE process (fm-pool f1a6c33 `score-loop.mjs ... --and ...`, fm-orchestrator 53b7892), heap cap 768 MB, keeper errors in tmp/fm/scheduled/loops.err; each loop keeps its own pid/log/status files (`--stop --name x` stops all three). Before: 255 + 454 + 241 = 950 MB RSS (02:45); after: ~360 MB, 535-560 MB for a minute while a loop reads the scan history (02:50-03:04)."
    - "Since 2026-11-24 (fm-orchestrator dfb2b61) the half-hourly replies job skips its slot while the 06:00 scan runs (the scan, replies and burn together took the pod to its 4 GiB limit on 11-23 at 06:00; the kernel killed the scan). fm-pool 8b2a873: a score loop no longer quits when its stale pid file holds its own pid after a pod restart."
    - "Mail index since 2026-11-24 04:00 (fm-mail 454f56d, fm-mail#1 step 1): inbox-replies.py and followups.py pick read both Gmail inboxes through freemotion-night/mail_index.py, which fetches only the mail new since the last run (UID last+1:*) and keeps headers since 2026-08-01 plus the application emails' text in fm-data/tmp/fm/mail-index/ (<key>.jsonl + <key>.state.json per inbox; git-ignored, rebuilt by itself on a new UIDVALIDITY). FM_MAIL_INDEX=0 reads Gmail directly again. Why: ends of round re-read 30-60+ days 20-30 times a day, over Gmail's ~2,500 MB/day IMAP limit ([OVERQUOTA] 3 Nov, 11-13 Nov, 21-23 Nov; agents missed verification emails). Reading the inboxes: 1,338 s before, 143-150 s after (Gmail still throttling). The index was built on the PC and copied to the server. check-sent, recruiter-replies, questionnaire-mail and imap-link still read Gmail directly."
    - "fm-controller was OOMKilled on 2026-11-13 05:00 (2 restarts)."
    - "Bookings (2026-11-23): fm-controller requests 3Gi (was 1Gi; it uses 1.45 GiB idle, 2.2 GiB median, 3.07 GiB peak), so the scheduler sees the server as it really is. The browsers request 1152Mi with a 2Gi limit (were 1Gi / 1536Mi; peaks 1,223 and 1,535 MiB). Applied between rounds with burn.mjs off, then on."
    - "The hub agent hung from 2026-11-21 13:30 to 2026-11-23 14:53 (idle in ep_poll, nothing sent: the dashboard showed 0 sent); restarted by SIGTERM, the daemon started a new one. Watchdog: moudimash99/fm-agent#5."
    - "fm-webllm on demand since 2026-11-20 (user: the website helper \"will be needed for freemotion ... we need it based on demand\", not a timer): fm-webllm-waker starts it when a call or /health comes in, holds the call until it answers (up to 5 min, else 503 = busy, the caller's next writer takes the job) and stops it after 30 min without calls. Its Gemini pace and cap are files on /web-llm, so restarts lose nothing. The manifest has no replicas on purpose. Rank stays batch-high (never pushes anyone out): with no room, it waits."
    - "PC tasks \\career-ops\\FreeMotion agent/burn/loops/night/replies/scan/weekly: all Disabled (last runs 2026-11-09..11); the PC is also blocked by %USERPROFILE%\\.fm-moved.json (present, 2026-11-11 19:22). Never run both (one never-apply-twice ledger)."
    - "The controller's website writers are OFF (WEB_LLM_OFF=1), live since 2026-11-11 21:57 and in the manifest since 2026-11-22: fm-webllm's Gemini step hangs (every bg-taste-match rating ask timed out at 900 s on the nights of 11-20 and 11-21), so turning them on would hold rounds up. Turn them on with the manifest's comment once an ask answers; fm-webllm itself still runs on demand for bg-taste-match."
    - "fm-data (/srv/apps/freemotion/fm-data, github.com/moudimash99/fm-data, private) is a git repo that the apps write all day, so it is never clean and is kept by snapshots: on the server `git add -A` and commit 'data: snapshot of the live folder, <UTC time>'; on the PC fetch that, merge, push to GitHub and to the server's refs/remotes/origin/main, then `git merge --ff-only origin/main` there. Last: 5d9d06a (snapshot 2026-11-22 13:30Z), merged with the PC's copy (56a06f8), which stopped at the move (2026-11-11 19:15). In the 33 files changed on both, the merge kept the server's: it had the PC's lines or newer states of the same records (statuses after reply emails, refreshed caches, burn on live and left on). Not on the server, kept only in 56a06f8: old entries the server's caches trimmed (2,029 posting-liveness.json URLs and 313 posting-text/misses.jsonl lines from before 11-09) and 3 lines of a lessons-learned.md entry rewritten since. Never copy the PC's files over the live ones."
    - "\\career-ops-test\\night test (Disabled) points at a deleted Claude scratchpad from 2026-10-11: a stale leftover."
