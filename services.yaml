# Cluster and server plumbing
# ---------------------------------------------------------------------------------------------------------------

- name: edge-proxy
  what: "The way in from the internet: Cloudflare tunnel (cloudflared) to nginx, which sends names to Traefik or Docker."
  kind: cluster
  runs: "docker on server (compose project `infra` from ~/Infra): cloudflared Up, nginx Up"
  manifest: Infra/docker-compose.yml, Infra/nginx/conf.d/site.conf
  image: "cloudflare/cloudflared:latest (unpinned), nginx:1.27-alpine (restart unless-stopped)"
  schedule: null
  url: "*.machaka.net through Cloudflare (Access login); nginx also on 192.168.1.116:8080"
  data:
    - "~/Infra/.env on the server (TUNNEL_TOKEN), nginx/conf.d mounted read-only"
  code:
    repo: Infra (server clone ~/Infra)
    branch: main on the server
    deployed: "main 51466a4 (2026-11-02) + uncommitted site.conf (freemotion.machaka.net to Traefik), identical to the PC's acer-jobs-and-alerts version"
  deploy: "Edit site.conf in the repo, update ~/Infra on the server, `docker exec nginx nginx -s reload`."
  check: "docker ps Up; https://machaka.net 200"
  probes:
    - {docker: cloudflared}
    - {docker: nginx}
  drift:
    - "The server's ~/Infra runs an uncommitted site.conf on main; the committed version is only on the unmerged branch acer-jobs-and-alerts."
  notes:
    - "Every name in site.conf now goes to Traefik (192.168.1.116:80); unmatchedtournament.machaka.net is a 301."

- name: k3s-system
  what: "The k3s cluster itself: k3s server, Traefik ingress, CoreDNS, metrics-server, local-path storage, priority classes, old-address forward."
  kind: cluster
  runs: >-
    k3s.service on moudimash99 (control plane, v1.36.5+k3s1), k3s-agent on acer-laptop; kube-system Deployments
    traefik (3.7.13), coredns, metrics-server, local-path-provisioner, DaemonSet svclb-traefik (server only)
  manifest: >-
    k3s built-ins (no manifests) plus Infra/k8s/cluster/traefik-config.yaml (HelmChartConfig), priority.yaml
    (PriorityClasses), old-address.yaml (tools/old-address: 192.168.1.135:5000/9001/45876 to .116/.93)
  image: "rancher/mirrored-library-traefik:3.7.13, rancher/klipper-lb:v0.4.17, rancher/mirrored-coredns-coredns:1.14.7, rancher/mirrored-metrics-server:v0.9.0, rancher/local-path-provisioner:v0.0.37"
  schedule: "k3s etcd snapshots every 12 h, 5 kept (/var/lib/rancher/k3s/server/db/snapshots; per the README, not checked)"
  url: "Traefik LoadBalancer 192.168.1.116:80/443"
  data:
    - "/var/lib/rancher/k3s on the server (state, snapshots, local-path volumes); /srv/k3s on the Acer"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\Infra (github.com/moudimash99/Infra)
    branch: acer-jobs-and-alerts (PC checkout)
    latest: "a72c6cb 2026-11-12 00:52 bg-taste-match: ratings on the Acer through fm-webllm's Gemini website"
    deployed: "the cluster matches acer-jobs-and-alerts except the items marked drift in each service"
    newer_not_deployed: "branch HEAD is applied except fm-controller (WEB_LLM_URL) and the bg-taste-match-gpu request; main is 41 commits behind the branch"
    uncommitted: 0
  deploy: "From the PC: kubectl apply -f k8s/cluster/; apply -R -f k8s/apps/; apply -f k8s/tools/; apply -k k8s/monitoring/ --server-side."
  check: "kubectl get nodes: both Ready; Traefik readiness GET /ping :8080"
  probes:
    - {nodes: all}
    - {k8s: kube-system/Deployment/coredns}
    - {k8s: kube-system/Deployment/traefik}
    - {k8s: kube-system/Deployment/metrics-server}
    - {k8s: kube-system/Deployment/local-path-provisioner}
    - {k8s: "kube-system/DaemonSet/svclb-traefik-*"}
  drift:
    - "Everything deployed since 2026-11-02 (Acer jobs, Free Motion, lab, alerts, registry) is on branch acer-jobs-and-alerts, 41 commits not merged to main; the server's ~/Infra clone is on main (2026-11-02), so applying from the server would roll the cluster back."
    - "Live-only objects not in Infra/k8s: apps/Deployment+Service mail-classifier (manifest in Email-remove)."
    - "old-address uses externalIPs, deprecated in Kubernetes 1.36 (manifest comment)."
  notes:
    - "Remote branch origin/frigate-on-acer is fully contained in acer-jobs-and-alerts."

- name: registry
  what: The cluster's own image registry, so images reach every node without docker save/import.
  kind: cluster
  runs: k8s kube-system/Deployment registry on moudimash99 (hostPort 5000)
  manifest: Infra/k8s/cluster/registry.yaml
  image: "registry:2.8.3 (IfNotPresent)"
  schedule: null
  url: "http://192.168.1.116:5000 (plain HTTP, no login, home network)"
  data:
    - "hostPath /srv/apps/registry on the server"
  code: { repo: none (upstream image), branch: null }
  deploy: "Apply registry.yaml; each node then needs /etc/rancher/k3s/registries.yaml and a k3s restart."
  check: "Readiness GET /v2/ on :5000"
  probes:
    - {k8s: kube-system/Deployment/registry}
  drift: []
  notes:
    - "Idle: the catalog is empty and the server has no /etc/rancher/k3s/registries.yaml (the Acer's was not checked). Every app image is still imported by hand."

- name: nfs-exports
  what: NFS server on the server, sharing Free Motion's data and code with the Acer.
  kind: cluster
  runs: "systemd nfs-server.service on the server (enabled)"
  manifest: "/etc/exports on the server (not in a repo)"
  image: null
  schedule: null
  url: "192.168.1.116 (NFS), to 192.168.1.93 only"
  data:
    - "/srv/apps/freemotion/fm-data to 192.168.1.93 (rw,sync)"
    - "/srv/apps/freemotion/ws to 192.168.1.93 (ro,sync)"
  code: { repo: none, branch: null }
  deploy: "Edit /etc/exports on the server, exportfs -ra."
  check: "fm-browser-acer and fm-webllm pods start (they mount these); bg-taste-match-llm runs"
  probes:
    - {systemd: nfs-server}
  drift: []
  notes:
    - "Used by fm-browser-acer (fm-data rw), fm-webllm (fm-data + ws ro), bg-taste-match-llm (ws ro)."

- name: tailscale
  what: Tailscale on the server; Free Motion's agents reach the hub at 100.111.127.103:8791 through it.
  kind: cluster
  runs: "systemd tailscaled.service on the server (enabled, running); the PC also has Tailscale installed"
  manifest: null
  image: null
  schedule: null
  url: "100.111.127.103 (server's Tailscale address)"
  data: []
  code: { repo: none, branch: null }
  deploy: "apt upgrade on the server."
  check: "systemctl is-active tailscaled; agents reach the hub"
  probes:
    - {systemd: tailscaled}
  drift: []
  notes:
    - "The llm-gateway also accepts Tailscale callers."

