    - "README says every 30/60/60 min; the manifest says fetch every 2 h, gpu hourly, llm hourly at night only."
  notes:
    - "Since 2026-11-23 each fetch pass stops at 110 minutes (timeout 6600 around run_fetch.sh, then exit 0); get_audio.py skips what is downloaded, so the next pass carries on. Before, a 1,657-video catch-up ran 9-13 h per pass, was pushed out by cat-flash and counted as failed, and status.py called it stuck (Infra#9)."
    - "bg-taste-match-gpu runs since 2026-11-23 (user: run it with a heat guard). heat_guard.py runs inside each stage (HEAT_* env in the manifest): it pauses before each 5-minute piece or file, and every 10 s during a piece, while the GPU is at 87 C or the CPU at 90 C, goes on at 70 / 80, ends the pass after 15 min of waiting, stops at once at 93 / 95, and stops the work (pass fails, exit 76) if it can't read the temperatures. It replaces heatwatch.sh, the one-night guard run from the PC on 2026-11-10 that died at 06:29, after which Whisper ran all day up to GPU 85 C / CPU 92 C and the GPU jobs were paused 11-11 to 11-23. cat-monitor stays paused. 2026-11-23 23:45 (user: \"change the guard and limits for now and we see\"): before, it checked only between pieces, a piece took the GPU from 68 to 84 C, and one reading of 85 ended each pass after 12-15 min; now it also checks during a piece, and the GPU levels went from 80 / 85 to 82 / 90, then on 2026-11-24 to 87 / 93 (user: \"go 87 93 for now\") (the GTX 1050's own: target 94, slowdown 97). The mid-piece pause holds the GPU lock, fine while cat-monitor is suspended."
    - "bg-taste-match-gpu is the first killable job (moudimash99/Infra#12): it books 64Mi / 50m (1400Mi before), so it uses the Acer's spare memory and the kernel kills it first when that runs out. Since 2026-11-23 01:45 Paris it runs Whisper only; capped at 2Gi since 14:40 (1Gi was tried overnight at the user's request: every run was killed by its own limit, kernel CONSTRAINT_MEMCG at 1.11 GiB, about 20 s in while the model loads, so nothing was transcribed; the Acer had room): SPEAKERS=0 (speaker separation reads a whole video, a run reached 2.5 GiB; it waits for a job of its own), WHISPER_PIECE_MINUTES=5, WHISPER_MAX_TRIES=3 (captions/<id>.tries: a video started by 3 runs that never finished it is skipped; delete the file to retry). Measured: on the Acer with 10-minute pieces the process peaked at 1,016 MiB RSS including the model load (1.23 GiB with page cache), about 3.6x real time; on the PC, 992 MiB with 5-minute pieces. run_gpu.sh starts a stage only with MIN_FREE_MIB (1280) free. podFailurePolicy: a scheduler push-out (DisruptionTarget) is not a failure; a memory kill (137) fails the run."
    - "All-reviews step started 2026-11-22 (user: download every relevant review, not only games the user rated): round 1's picks were all downloaded (about 2,500 videos, 728 h, 38 GB). 3mbg released and sorted by hand; /work/sort_all.sh (nohup in the shell pod, log /work/sort_all.log) releases and sorts 19 more channels with claude-haiku through the gateway (the Gemini API key was out of quota). Then /work/sort_rest.sh (same pod, log /work/sort_rest.log) waits for it and does rahdo and dt (user: all 25 channels). The fetch job's CHANNELS put rahdo and dt last (live and manifest, 2026-11-22), so they only fill the room the other 21 leave: all 25 sorted is roughly 13,000+ h, ~700 GB at 0.052 GB/h, more than the ~440 GB above the 150 GB guard. The fetch job downloads whatever is released, at 30 s between videos. Only one sorter: the gateway runs one Claude call at a time. The Gemini website (fm-webllm) could not help: on 2026-11-22 14:30 even a 30-character ask got no answer (gemini-webapi init gets HTTP 400 from batchexecute, then hangs), while `web-llm.py check` says both sites are signed in."
    - "The 2026-11-22 sort was not complete although both logs end in SORT DONE: from about 16:20 Paris every Haiku call got the Claude plan's 5-hour limit, so ttgg, bgco, bower, rahdo and dt were released but not labelled. 2026-11-23 21:58 Paris: /work/sort_retry.sh (nohup in the shell pod, log /work/sort_retry.log, per-channel output /work/sort_retry.<ch>.out) labels only those 5 and stops at the first failing channel instead of printing DONE; /work/sort_retry_loop.sh (nohup, log /work/sort_retry_loop.log) restarts it 30 min after each stop until RETRY DONE, at most 24 passes. It uses the Max plan login (.claude-account1) that Free Motion also uses; the API-key route (claude-haiku-api in the gateway) is not built."
    - "Hosts merged 2026-11-24 with hosts.py merge (every table that stores a host id follows; variants become aliases, so later ratings are filed right): Rahdo <- Rado, Richard, Richard Ham; Jen <- wife; Ruel Gaviola <- Ruel Gaviola (rahdo:ruel); Tom Vasel <- Tom Vassell, Tom (dt); Roy Cannaday <- Roy Candy/Canay/Canik; Sam Healey <- Sam; Luke Hector <- Luke Hechter; Game Boy Geek <- Gameboy geek; BoardGameCo's Alex <- Alex Radcliffe/Radical/Macliff/Mackler (shown as Alex: no title confirms a surname). Evidence: the variants never speak in the same video; spellings from video titles (Cannaday 110 titles, Healey 690, Gaviola 4). Left apart: rahdo:chris and rahdo:chris-george (only a first name in common). 4,337 ratings before and after, none orphaned, quick_check ok. Backup: /work/bgtaste.before-host-merge-2026-11-24.db (172 MB). The merge ran during a rating pass; the same merges were run again during it (01:17 UTC) and found nothing filed under a variant (they would move such rows)."
    - "2026-11-24: rating passes add no verdicts. Every video times out after 900 s in fm-llm's web-llm.py ask gemini (the Gemini website, failing since 2026-11-22), and each channel stops after 2 failures; nothing has been rated since 2026-11-12. Since 2026-11-24 (owner: use fm-llm, Gemini first if possible, Claude Haiku on the normal plan otherwise) the llm job asks fm-llm's gateway (GEMINI_BACKEND=fm) for claude-haiku; fm-llm 41e6fea (a request may name several models in order) is on GitHub but not yet deployed on the server: once it is, set FM_LLM_MODEL to gemini-pro|claude-haiku so Gemini is asked first (its API key was over quota on 2026-11-24)."
    - "Since 2026-11-24 the fetch CronJob, like gpu, ignores a scheduler push-out (podFailurePolicy on DisruptionTarget): three passes on 11-23/24 ended failed because a higher-ranked pod (the lab restarting on a deploy, among others) took the Acer's booked memory, and status.py reported downloads as stale."
    - "Scoring rules since 2026-11-24 (score.py 89d21c7, 40601b4): the owner's team inference stands for every host (half weight times team membership; a TEAM_REGULAR cutoff tried that night was removed at the owner's word, option 2); the 5-game ranking counts own games 1 and team-only games by their weight (rank_n), so one-video guests lent the team's verdicts (0.065 each) aren't ranked (ranked hosts 44 -> 20 for the owner); 'most anticipated' lists weigh 0; verdicts naming an expansion filed under its base game don't count (14 of 4,228); a verdict the attribution checks rejected doesn't count on the host's own top list either."
    - "Last good runs: fetch 2026-11-20 16:13 (after the Acer came back), llm 2026-11-16 07:15, gpu 2026-11-10 08:15."
    - "The 4-day gap is a stuck Job, not the code: fetch-29913605 stayed active from 2026-11-16 09:05 to 2026-11-20 and concurrencyPolicy Forbid skipped every run behind it; likewise llm-29913465 stayed unfinished until 2026-11-20 13:29, so llm has not been scheduled since 2026-11-16 06:45."
    - "Whisper captions done on the PC on 2026-11-18 were pushed to the Acer on 2026-11-20 (231/231); the folder Documents/Coding/bg-taste-match-pending-captions stays as a spare copy."
    - "PC backup 2026-11-20: the PC's whole bg-taste-match folder (code, .git, audio 20.7 GB, captions, diar, DBs; not .venv-voice) and the pending-captions folder, copied to the server at /srv/backups/pc-2026-11-20 (read-only, MANIFEST.sha256 checked file by file)."
    - "The llm stage reaches fm-webllm through fm-webllm-waker (2026-11-20): run_llm.sh's minute of /health tries wakes the helper."
    - "OPEN 2026-11-20 night: every Gemini website call from the rating (20:45, 21:00, 21:15...) hung until the helper's 900 s limit (web-llm-serve: 'ask gemini: exit 1, N chars in, 0 out'; the caller's subprocess times out at 900 s too), so nothing was rated. The helper pod reaches Google fine (DNS and HTTPS in under a second), and its own log shows each prompt arriving whole through the waker (7,000-24,000 chars in) before its Gemini step returns nothing: the hang is in that step (the Gemini website session: cookies.json from 2026-11-11, or gemini-webapi), not the waker. Still so at 01:00 on 2026-11-21; no ask has answered through the waker yet. While it lasts the helper stays booked (1 GiB) all night, so BoardGameFinder at 05:00 must also push out the bg-taste-match shell and leaves 57 Mi, too little for the archiver until it ends. Not probed with extra calls, so as not to prolong any Google block."
  menu:
    title: Taste Match
    icon: mdi-youtube
    href: https://tastematch.machaka.net
    description: Reviews from YouTube to each host's scores
    pods: null
    widget:
      type: customapi
      url: http://lab.tools.svc/api/summary/tastematch
      refreshInterval: 60000
      display: list
      mappings:
      - field: download
        label: Downloaded
      - field: transcribe
        label: Transcribed
      - field: speakers
        label: Speakers
      - field: rate
        label: Rated

- name: cat-camera-jobs
  what: "Cat camera job from the Cat-Camera repo: cat-flash (flash of the day video). The feeding monitor cat-monitor was removed on 2026-11-24."
  kind: scheduled-job
  system: cats
  lifecycle: production
  depends_on: [frigate]
  runs: "k8s apps/CronJob cat-flash on acer-laptop; PC Task Scheduler copy CatCameraFeedingMonitor (disabled)"
  manifest: Infra/k8s/apps/cat-monitor/cat-monitor.yaml
  image: "cat-monitor: Python, PyTorch and the model only, built on the server from ~/build/cat-monitor (pull Never)"
  schedule:
    cat-flash: "20 0,19 * * * Europe/Paris (1 h limit, backoffLimit 1)"
  url: "none (flash and status on https://catcam.machaka.net through the lab)"
  data:
    - "hostPath /srv/apps/cat-monitor on the Acer (reports, flash/ videos)"
    - "hostPath /srv/apps/cat-monitor/code on the Acer (the scripts, read-only)"
    - "hostPath /var/lib/frigate/media/recordings (read-only, Frigate's recordings)"
  code:
    repo: C:\Users\Moudimash99\Documents\GitHub\Cat-Camera (github.com/moudimash99/Cat-Camera)
    branch: main
    version_check: "none (the image holds only Python, PyTorch and the model; compare the Acer's /srv/apps/cat-monitor/code with the PC's files)"
    deployed: "main 6f8700d (2026-11-25): daily_flash.py on the Acer's /srv/apps/cat-monitor/code matches the PC's (md5 checked), copied by hand; the model version kept as daily_flash.py.bak-2026-11-25-model. automated_feeder_monitor.py and feeding_pipeline.py there are from 05a2324 and no longer run (cat-monitor removed)."
  deploy: "Scripts: copy to /srv/apps/cat-monitor/code on the Acer (no script found). Image: build Dockerfile.monitor on the server, import on the Acer, set the tag, apply."
  check: >-
    cat-flash: good run within 38 h (longest gap 19 h x 2).
  probes:
    - {k8s: apps/CronJob/cat-flash, max_age_h: 38}
  drift:
    - "2026-11-24: the lab (catcam page job cards, the summary's monitor line) still asks for CronJob cat-monitor, which no longer exists; it shows as not found / no run. To tidy in the lab's code."
  notes:
    - "The server's ~/Cat-Camera clone is on main (its commit '19' of 2026-02-07 merged on 2026-11-22); its data folders cat/, benchmark_results/ and output/ (~9 GB) are gitignored."
    - "Since 2026-11-25 cat-flash runs no model: it takes the cats from Frigate's Simba/Nala sightings (Cat-Camera 0ab79e4, copied to the Acer; the model version kept as daily_flash.py.bak-2026-11-25-model). Frigate saves every cat sighting for it, not only feeder ones (config changed the same day). It also measures feeding time per cat (Cat-Camera 6f8700d): the feeder's ArUco tag found in the recordings, since the camera turns; the lab's flash page shows minutes at the bowl and visits. Its 1Gi request still fits the old model run: lower it once a run's real peak is measured."
    - "cat-flash rank batch-make-room since 2026-11-20: it may stop the mail classifier for its ~4 minutes. The 2026-11-20 19:20 run started at 20:13 when the classifier restarted and finished at 20:14."
    - "cat-flash last good run 2026-11-11 19:24; runs of 2026-11-19 00:20, 19:20 and 2026-11-20 00:20 failed with DeadlineExceeded (1 h)."
    - "cat-monitor last good run 2026-11-10 04:27; 11-11 and 11-12 hit the 3 h limit, then it was suspended. Removed 2026-11-24 (user): cat detection moves into the live Frigate with the Simba/Nala model (Cat-Camera#7, #10); its CronJob and the CatMonitorMissed alert are gone, its reports stay in /srv/apps/cat-monitor."
    - "2026-11-22: every result before 05a2324 is suspect. Batched FP16 on the PC's GTX 1660 found no cats at all (Nala at the bowl 21 Nov 12:51 counted 0 s), and one misnamed frame gave a cat the other's whole session. Both fixed in 05a2324 (FP32 unless CATCAM_HALF=1; sessions per cat). Whether FP16 batches also failed on the Acer's GTX 1050 was not checked."
    - "2026-11-22: the 21 Nov blocks were run on the PC (night-gpu/rerun.sh, 3 streams, about 2.4 h per 8-hour block) and pushed to the Acer's rolling_runs. The CronJob's 'once 1' looks at only the last hour, and its 2560Mi request does not fit on the Acer as booked now."
    - "PC task CatCameraFeedingMonitor (Documents\\GitHub\\Cat-Camera\\automated_feeder_monitor.py once 8, every 8 h): Disabled since 2026-09-13."
