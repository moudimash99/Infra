- name: unmatched
  what: Unmatched fighter matcher, strategy guides and tournaments (Flask + gunicorn).
  kind: web-app
  system: board-games
  lifecycle: production
  depends_on: []
  runs: k8s apps/Deployment unmatched on acer-laptop; apps/CronJob unmatched-restart on moudimash99 (Mondays 08:00 UTC)
  manifest: Infra/k8s/apps/unmatched/unmatched.yaml
  image: "unmatched, built on the server by scripts/deploy.sh, tag = build time (pull Never)"
  schedule: "unmatched-restart: 0 8 * * 1 (UTC), two hours after refresh-stats.yml"
  url: [https://unmatched.machaka.net, "unmatchedtournament.machaka.net (nginx 301 to /tournaments)"]
  data:
    - "hostPath /srv/apps/unmatched on the Acer (tournament data files)"
    - "Secret apps/unmatched-env (SECRET_KEY, TOURNAMENT_PASSWORD_HASH)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\unmatched_matcher (github.com/moudimash99/unmatched_matcher); server copy ~/unmatched_matcher
    branch: main
    not_in_image: [input/merged_win_pct.json, input/merged_games.json, input/stats_meta.json, input/prices.json]
  deploy: >-
    (Flux, since 2026-11-23: the new tag must be committed and pushed in k8s/apps/unmatched/unmatched.yaml, or Flux
    puts the old one back within 10 minutes.) scripts/deploy.sh on the server, in a terminal: git pull, docker build, copies the image to the Acer and loads it
    there (asks for the Acer's passwords), `kubectl set image`, rollout status, then rewrites the tag in
    ~/Infra/k8s/apps/unmatched/unmatched.yaml (copy it to the PC's Infra and commit it).
  check: "Pod Ready (tcpSocket :8001); Homepage siteMonitor http://unmatched.apps.svc"
  probes:
    - {k8s: apps/Deployment/unmatched}
    - {k8s: apps/CronJob/unmatched-restart, max_age_h: 170}
  drift: []
  notes:
    - "Since 2026-11-23 the PC clone's origin is the plain https://github.com/moudimash99/unmatched_matcher.git with gh as the login (the old token, \"Desktop PC\", was deleted on GitHub: unmatched_matcher#53)."
    - "The weekly workflow refresh-stats.yml (Mondays 06:00 UTC) commits the new stats and prices straight to main when they changed, after the tests pass on them (since 2026-11-22). Since 2026-11-23 they reach the site without a deploy (unmatched_matcher#54): the pod's init step `stats` fetches the four files from main at each start (a file it can't fetch or parse keeps the image's copy), and the CronJob unmatched-restart restarts the site on Mondays at 08:00 UTC (a Role allows it to patch only this Deployment). status.py does not count commits that change only those files (code.not_in_image). The old branches stats/refresh-2026-10-19..11-09 were deleted on 2026-11-22; a git bundle of them is in /srv/backups/git-branches on the server."
    - "The stats come from main while the code stays at its image: if a change to the stats' format ever lands together with app code, deploy that code before the next Monday restart (the init step only checks the files are valid JSON)."
    - "The restart writes the kubectl.kubernetes.io/restartedAt annotation, which the manifest does not hold: `kubectl diff` shows it, and applying the file removes it (one more restart, harmless)."
    - "unmatched-tournament is retired; its two Docker images on the server were deleted on 2026-11-23 (Infra#11)."
  menu:
    title: Unmatched
    icon: mdi-sword-cross
    description: Fighter matcher, guides and tournaments
    ping: http://unmatched.apps.svc

