# ---------------------------------------------------------------------------------------------------------------
# Scheduled jobs
# ---------------------------------------------------------------------------------------------------------------

- name: free-motion
  what: Free Motion job-application automation (controller daemon, one browser per lane, the ChatGPT/Gemini website writer).
  kind: scheduled-job
  runs: >-
    k8s apps/Deployment fm-controller on moudimash99; apps/StatefulSet fm-browser-acer (2 pods), apps/Deployment
    fm-webllm (0 or 1 copy, started on demand) and apps/Deployment fm-webllm-waker on acer-laptop. PC Task Scheduler
    copies disabled.
  manifest:
    - Infra/k8s/apps/fm-controller/fm-controller.yaml (+ move/ scripts)
    - Infra/k8s/apps/fm-browser/fm-browser.yaml (headless Service + NetworkPolicy, controller only)
    - Infra/k8s/apps/fm-webllm/fm-webllm.yaml (Service fm-webllm :8933 -> the waker; Service fm-webllm-backend -> the helper; the waker's ConfigMap, ServiceAccount/Role (scale fm-webllm only); NetworkPolicies, controller and bg-taste-match)
  image: "docker.io/library/fm:2026-11-10a for all three (pull Never; built on the server 2026-11-10 20:14 from Infra/images/fm, ~8 GB)"
  schedule: "fm-orchestrator `scheduled.mjs daemon` inside the controller (Task Scheduler's stand-in); rounds, burn, replies, scan, weekly, loops"
  url: "none of its own (dashboard = freemotion-hub); browsers at <pod>.fm-browser.apps.svc:8931/mcp, writer at fm-webllm.apps.svc:8933 (the waker, which starts the helper)"
  data:
    - "server hostPaths: /srv/apps/freemotion/ws (code), /srv/apps/freemotion/fm-data (data, .env), /srv/apps/freemotion/home (driver logins, transcripts)"
    - "NFS from the server to the Acer: /srv/apps/freemotion/fm-data (rw, browsers) and /srv/apps/freemotion/ws (ro, fm-webllm)"
    - "Acer hostPaths: /srv/apps/freemotion-browser/<pod> (browser profiles, uid 1000), /srv/apps/freemotion-webllm/web-llm (signed-in ChatGPT profile, cookies)"
  code:
    repo: C:\Users\Moudimash99\Documents\Coding\fm\fm-* (deployed checkouts in /srv/apps/freemotion/ws, fed from bare repos /srv/apps/freemotion/git)
    branch: main everywhere
    version_check: "checkout moudimash99@192.168.1.116:/srv/apps/freemotion/ws"
    deployed_equals_pc_main: >-
      fm-agent ccf7714, fm-core 0e3fc2f, fm-docs 0ed0985, fm-llm 933c953, fm-mail 7c2d9b0, fm-orchestrator 06d3c2d,
      fm-pool ab6a896, fm-web 08e7197 (server ws = PC main for all eight)
    newer_not_deployed: >-
      memory-diet branches (fm-pool#7 memory fix, 2026-11-12): fm-agent +1, fm-orchestrator +2, fm-pool +1, in
      fm/.worktrees, deploy script fm/.worktrees/deploy-memory-fix.sh. Image: Infra/images/fm b161c73 (2026-11-10 23:37)
      and b10d975 (2026-11-11 01:52) are not in fm:2026-11-10a.
    uncommitted: "fm-pool 2 files (make-pool.mjs, its test); fm-web untracked package-lock.json (PC and server); fm-data 1150 (data repo)"
    unpushed: "fm-pool main is 3 commits ahead of origin/main on GitHub (the server's bare repo has them)"
  deploy: >-
    Code: push from the PC to the server's bare repos, then `git pull` in /srv/apps/freemotion/ws between rounds
    (restart fm-webllm/llm-gateway after). Image: build images/fm on the server, `docker save fm:<tag> | ssh <node>
