{#- The filter bar every page of the homelab tool shares (status.js applies it to every [data-card] list).
    Needs MACHINES and the project names in `groups`. -#}
<div class="filters" id="filters" role="search">
  <div class="seg" data-f="m" role="group" aria-label="Machine">
    <button type="button" data-v="" class="on">All machines</button>
    {% for node, name in MACHINES %}<button type="button" data-v="{{ node }}">{{ name }}</button>{% endfor %}
  </div>
  <label class="sel"><span class="sr">Project</span>
    <select data-f="p" aria-label="Project">
      <option value="">All projects</option>
      {% for g in (d.groups if d else []) %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
    </select></label>
  <label class="toggle"><input type="checkbox" data-f="only"><span>Problems only</span></label>
</div>
