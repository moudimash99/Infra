<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>{% block title %}Lab{% endblock %}</title>
<link rel="stylesheet" href="{{ R }}/static/lab.css?v=3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3C/svg%3E">
</head>
<body>
<header class="top"><div class="bar">
  <nav class="tabs">
    {% for key, label, url in SITE_LINKS %}
    <a href="{{ (R ~ '/') if key == me else url }}" class="{{ 'on' if key == me }}">{{ label }}</a>
    {% endfor %}
    <a href="{{ LAB_URL }}">Lab ↗</a>
  </nav>
</div></header>
<main>
{% block main %}{% endblock %}
<footer class="foot">Read {{ now() | ago }}</footer>
</main>
<script src="{{ R }}/static/lab.js?v=3" defer></script>
</body>
</html>
